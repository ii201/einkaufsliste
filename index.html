<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einkaufsliste</title>
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* „Klar und kühl“: kühles Grau, weiße Karten mit feinen Linien, ein blauer Akzent, Schrift nur normal und halbfett */
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-2: #f7f9fb;
    --ink: #1b2330;
    --muted: #6b7685;
    --faint: #8a94a3;
    --line: #e3e7ec;
    --line-soft: #eef1f4;
    --accent: #2f6fed;
    --accent-2: #2f6fed;
    --accent-ink: #ffffff;
    --accent-soft: rgba(47, 111, 237, .1);
    --danger: #d14343;
    --danger-soft: rgba(209, 67, 67, .1);
    --pos: #15803d;
    --pos-soft: rgba(21, 128, 61, .1);
    --neg: #c2410c;
    --heart: #e11d48;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-lg: 0 16px 40px -12px rgba(16, 24, 40, .25);
    --tint: 12%;
    --tint-strong: 20%;
    --tabbar: 56px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1318;
      --surface: #171c22;
      --surface-2: #1c222a;
      --ink: #e6eaf0;
      --muted: #8b95a3;
      --faint: #6f7987;
      --line: #262d36;
      --line-soft: #20262e;
      --accent: #5b8def;
      --accent-2: #5b8def;
      --accent-soft: rgba(91, 141, 239, .16);
      --danger: #e06666;
      --danger-soft: rgba(224, 102, 102, .14);
      --pos: #4ade80;
      --pos-soft: rgba(74, 222, 128, .12);
      --neg: #fb923c;
      --heart: #fb7185;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-lg: 0 18px 44px -12px rgba(0, 0, 0, .6);
      --tint: 16%;
      --tint-strong: 26%;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.45 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  b, strong { font-weight: 600; }
  svg.i { width: 1em; height: 1em; flex: none; vertical-align: -.14em; }
  .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); margin-right: 7px; vertical-align: 1px; flex: none; }

  .wrap { max-width: 560px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }

  /* ---------- Kopf ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(14px);
    -webkit-backdrop-filter: saturate(1.4) blur(14px);
  }
  .head { display: flex; align-items: flex-end; justify-content: space-between; padding-top: 12px; padding-bottom: 8px; gap: 12px; }
  .date { font-size: 12px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  h1 { margin: 2px 0 0; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pos); display: inline-block; }
  .dot.off { background: var(--danger); }

  .progress { padding-bottom: 8px; }
  .progress[hidden] { display: none; }
  .progress-top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .progress-top b { color: var(--ink); font-weight: 600; }
  .bar { height: 3px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .5s cubic-bezier(.2, .8, .2, 1); }

  main { padding-bottom: calc(var(--tabbar) + 84px + env(safe-area-inset-bottom)); }

  /* ---------- Navigation unten ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 7;
    background: color-mix(in srgb, var(--surface) 94%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar-in { display: flex; height: var(--tabbar); }
  .tab {
    position: relative; flex: 1; border: 0; background: none; color: var(--faint);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 11px; font-weight: 500; transition: color .15s;
  }
  .tab svg { width: 23px; height: 23px; }
  .tab.active { color: var(--accent); }
  .tab .tab-badge { position: absolute; top: 5px; left: calc(50% + 6px); }
  .tab-badge { min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px; background: var(--heart); color: #fff; font-size: 10.5px; font-weight: 600; display: inline-grid; place-items: center; }
  .tab-badge[hidden] { display: none; }
  body:is(.mode-kochen, .mode-kasse, .mode-mehr) :is(#progress, #list, #done, .composer) { display: none !important; }
  body:not(.mode-kochen) #cook { display: none; }
  body:not(.mode-kasse) #kasse { display: none; }
  body:not(.mode-mehr) #mehr { display: none; }
  body:is(.mode-kochen, .mode-mehr) main { padding-bottom: calc(var(--tabbar) + 28px + env(safe-area-inset-bottom)); }
  body.mode-kasse main { padding-bottom: calc(var(--tabbar) + 80px + env(safe-area-inset-bottom)); }

  /* ---------- Kategorie-Karten ---------- */
  .group {
    --c: #888;
    margin-top: 8px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--c);
    border-radius: 12px; overflow: hidden;
  }
  .group-head { display: flex; align-items: baseline; gap: 8px; padding: 7px 12px 1px 11px; }
  .group-head h2 { margin: 0; flex: 1; font-size: 12px; font-weight: 500; color: var(--muted); }
  .group-head .n { font-size: 11.5px; color: var(--faint); }

  ul { list-style: none; margin: 0; padding: 0; }
  .item { --c: #888; position: relative; overflow: hidden; }
  .item + .item .inner::before {
    content: ""; position: absolute; top: 0; left: 40px; right: 0; height: 1px; background: var(--line-soft);
  }
  .swipe-bg {
    position: absolute; inset: 0; background: color-mix(in srgb, var(--danger) 75%, var(--surface)); color: #fff;
    display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; font-weight: 600; font-size: 13.5px;
    opacity: 0; transition: background .15s;
  }
  .item.swiping .swipe-bg { opacity: 1; }
  .item.armed .swipe-bg { background: var(--danger); }
  .inner {
    position: relative; display: flex; align-items: center; gap: 10px; padding: 5px 12px 5px 11px; min-height: 40px;
    background: var(--surface); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y;
  }
  .check {
    flex: none; width: 20px; height: 20px; border-radius: 50%; padding: 0;
    border: 1.5px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: none;
    display: grid; place-items: center; transition: background .2s, border-color .2s, transform .2s;
  }
  .check svg { width: 11px; height: 11px; color: #fff; }
  .check path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .25s ease-out .05s; }
  .item.done .check, .item.ticking .check { background: var(--c); border-color: var(--c); }
  .item.done .check path, .item.ticking .check path { stroke-dashoffset: 0; }
  .item.ticking .check { animation: tick .32s cubic-bezier(.3, 1.6, .5, 1); }
  .item.ticking .name { color: var(--muted); }
  .text { flex: 1; min-width: 0; }
  .name { font-size: 15px; font-weight: 400; overflow-wrap: anywhere; transition: color .2s; }
  .qty { flex: none; font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .by { display: inline-block; max-width: 48%; margin-left: 6px; vertical-align: -2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--faint); font-size: 12px; }
  .rem { margin-left: 5px; color: var(--accent); font-size: 12px; }
  .del { flex: none; width: 28px; height: 28px; border: 0; background: none; color: var(--faint); font-size: 18px; border-radius: 8px; display: none; }
  @media (hover: hover) {
    .del { display: block; opacity: 0; transition: opacity .15s; }
    .item:hover .del { opacity: .8; }
    .del:hover { background: var(--bg); }
  }
  .item.enter .inner { animation: slideIn .35s cubic-bezier(.2, .8, .2, 1); }

  /* ---------- Im Wagen ---------- */
  .done-head { display: flex; justify-content: space-between; align-items: center; margin: 20px 2px 6px; }
  .done-head h2 { margin: 0; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .finish { border: 0; height: 30px; padding: 0 12px; border-radius: 9px; font-weight: 600; font-size: 13px; color: var(--accent); background: var(--accent-soft); }
  .finish:active { transform: scale(.97); }
  .done-list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; opacity: .7; }
  .item.done .name { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--muted); }

  .empty, .cook-empty { text-align: center; color: var(--muted); padding: 40px 20px 8px; font-size: 14px; }
  .empty .big, .cook-empty .big {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 12px; display: grid; place-items: center; font-size: 24px;
    background: var(--surface); border: 1px solid var(--line); color: var(--faint);
  }
  .empty strong, .cook-empty strong { display: block; color: var(--ink); font-size: 16px; font-weight: 600; margin-bottom: 2px; }

  /* ---------- Eingabe unten ---------- */
  .composer {
    position: fixed; left: 0; right: 0; bottom: calc(var(--tabbar) + env(safe-area-inset-bottom)); z-index: 6;
    padding: 0 0 8px; pointer-events: none;
  }
  .panel {
    pointer-events: auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--shadow-lg); padding: 6px;
  }
  .composer:not(.typing) :is(.chips, .chips-label) { display: none !important; }
  .composer.qtyfocus :is(.chips, .chips-label) { display: none !important; }
  .qty-bar { display: none; gap: 6px; padding: 2px 2px 8px; }
  .qty-bar.on, .composer.qtyfocus .qty-bar { display: flex; }
  .qty-bar button { flex: 1; height: 36px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-weight: 500; color: var(--ink); background: var(--surface-2); }
  .qty-bar button:first-child { flex: 1.4; color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .chips-label { font-size: 11.5px; color: var(--muted); margin: 2px 0 6px 6px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    --c: #888; flex: none; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 99px;
    padding: 6px 11px; font-size: 14px; font-weight: 400; white-space: nowrap; color: var(--ink); background: var(--surface);
    user-select: none; -webkit-user-select: none; transition: transform .12s;
  }
  .chip:active { transform: scale(.96); }
  .chip.del-mode { background: var(--danger); border-color: var(--danger); color: #fff; }
  .row { display: flex; gap: 6px; align-items: center; }
  .field { flex: 1; display: flex; align-items: center; background: var(--bg); border-radius: 12px; min-width: 0; border: 1px solid transparent; transition: border-color .15s; }
  .field:focus-within { border-color: var(--accent); }
  .cat { --c: #888; position: relative; flex: none; width: 30px; height: 30px; margin-left: 5px; border-radius: 9px; display: grid; place-items: center; background: var(--surface); }
  .cat::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
  .cat select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; }
  .field input { border: 0; background: none; outline: none; padding: 0 9px; height: 42px; min-width: 0; font-size: 16px; font-weight: 400; }
  .field input::placeholder { color: var(--faint); }
  #name { flex: 1; }
  #qty { width: 62px; flex: none; padding: 0 4px; text-align: center; border-left: 1px solid var(--line); height: 26px; }
  .pin { flex: none; width: 32px; height: 32px; margin-right: 4px; border: 0; border-radius: 9px; background: none; color: var(--faint); display: grid; place-items: center; }
  .pin svg { width: 18px; height: 18px; }
  .pin.on { color: var(--accent); background: var(--accent-soft); }
  .add { flex: none; width: 42px; height: 42px; border-radius: 12px; border: 0; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); transition: transform .12s, opacity .2s; }
  .add svg { width: 20px; height: 20px; }
  .add:active { transform: scale(.94); }
  .add:disabled { opacity: .35; }

  /* ---------- Anmeldung ---------- */
  .login { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; }
  .login[hidden] { display: none; }
  .card { position: relative; width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-lg); padding: 26px 20px 20px; }
  .card .logo { width: 52px; height: 52px; border-radius: 14px; display: block; margin-bottom: 16px; }
  .card h2 { margin: 0 0 4px; font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
  .card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  .card label { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); margin: 0 0 5px 2px; }
  .card input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 11px; background: var(--bg); padding: 0 14px; font-size: 16px; margin-bottom: 14px; outline: none; }
  .card input:focus { border-color: var(--accent); }
  .btn-main { width: 100%; height: 46px; border: 0; border-radius: 11px; font-weight: 600; font-size: 15px; margin-top: 4px; color: var(--accent-ink); background: var(--accent); }
  .err { color: var(--danger); font-size: 13.5px; font-weight: 500; min-height: 20px; margin-top: 12px; text-align: center; }

  /* ---------- Kochen ---------- */
  .subtabs { display: flex; gap: 3px; padding: 3px; margin: 2px 0 4px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .subtab { flex: 1; border: 0; height: 32px; border-radius: 8px; font-weight: 500; font-size: 13.5px; color: var(--muted); background: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .subtab.active { color: var(--ink); background: var(--surface); box-shadow: var(--shadow-sm); }

  .dcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: transform .3s, opacity .3s; }
  .dcard + .dcard { margin-top: 10px; }
  .dcard .dimg { aspect-ratio: 16 / 9; background: var(--line-soft) center / cover no-repeat; display: block; }
  .dcard .dbody { padding: 12px 14px 14px; }
  .dcard h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; line-height: 1.3; }
  .dcard h3 a { color: inherit; text-decoration: none; }
  .dmeta { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  .dbtns { display: flex; gap: 8px; }
  .dbtns button { flex: 1; height: 40px; border: 1px solid var(--line); border-radius: 10px; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--surface); color: var(--ink); }
  .dbtns .ja { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .dcard.out-yes { transform: translateX(110%) rotate(6deg); opacity: 0; }
  .dcard.out-no { transform: translateX(-110%) rotate(-6deg); opacity: 0; }

  .search { display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 12px; margin-top: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .search:focus-within { border-color: var(--accent); }
  .search svg { color: var(--faint); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 16px; }
  .search input::placeholder { color: var(--faint); }
  .fchips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 2px; margin: 0 -16px; scrollbar-width: none; }
  .fchips::-webkit-scrollbar { display: none; }
  .fchip { flex: none; border: 1px solid var(--line); border-radius: 99px; padding: 5px 11px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--ink); background: var(--surface); transition: background .15s, color .15s; }
  .fchip.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
  .fchip.sep { margin-left: 4px; }
  .rcount { color: var(--muted); font-size: 12px; margin: 10px 2px 8px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .gcard { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .gcard a { color: inherit; text-decoration: none; }
  .gimg { display: block; aspect-ratio: 4 / 3; background: var(--line-soft) center / cover no-repeat; }
  .gbody { padding: 8px 10px 10px; }
  .gbody b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; line-height: 1.3; font-weight: 500; min-height: 2.6em; }
  .gmeta { margin-top: 4px; font-size: 11.5px; color: var(--muted); }
  .star { color: #d99a00; }
  .heart {
    position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0;
    display: grid; place-items: center; font-size: 16px; color: var(--heart);
    background: color-mix(in srgb, var(--surface) 92%, transparent); box-shadow: var(--shadow-sm); transition: transform .15s;
  }
  .heart:active { transform: scale(.88); }
  .heart.on { color: #fff; background: var(--heart); }
  .heart.plan { color: #fff; background: var(--accent); }
  .heart.pop { animation: tick .35s cubic-bezier(.3, 1.6, .5, 1); }
  .ribbon {
    position: absolute; top: 12px; left: 8px; padding: 3px 8px; border-radius: 99px; font-size: 11px; font-weight: 600;
    color: #fff; background: var(--heart); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: fit-content; max-width: calc(100% - 56px);
  }
  .more { display: block; width: 100%; margin-top: 12px; height: 42px; border: 1px solid var(--line); border-radius: 10px; font-weight: 500; font-size: 14px; background: var(--surface); }

  .section-title { margin: 22px 2px 7px; font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .section-sub { margin: -3px 2px 9px; color: var(--muted); font-size: 13px; }
  .mlist { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
  .mrow + .mrow { border-top: 1px solid var(--line-soft); }
  .mthumb { flex: none; width: 44px; height: 44px; border-radius: 9px; background: var(--line-soft) center / cover no-repeat; }
  .mt { flex: 1; min-width: 0; }
  .mt a { color: inherit; text-decoration: none; font-weight: 500; font-size: 14.5px; line-height: 1.3; display: block; }
  .mt span { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  .mbtn { flex: none; width: 34px; height: 34px; border: 0; border-radius: 9px; display: grid; place-items: center; font-size: 15px; color: var(--muted); background: var(--bg); }
  .mbtn.go { color: var(--accent); background: var(--accent-soft); }

  .scard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .scard + .scard { margin-top: 10px; }
  .scard p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
  .pantry { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .pantry-add { display: flex; gap: 8px; }
  .pantry-add input { flex: 1; min-width: 0; height: 42px; margin: 0; }
  .btn-line { border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; height: 42px; font-weight: 500; font-size: 14px; background: var(--surface); color: var(--ink); }

    { id: 'Frühstück & Süßes', icon: '🍫', color: '#d0559a', kw: ['müsli', 'cornflakes', 'haferflocken', 'marmelade', 'konfitüre', 'honig', 'nutella', 'schokolade', 'schoko', 'kekse', 'chips', 'gummibär', 'süßigkeit', 'riegel', 'kaffee', 'tee', 'kakao', 'nüsse', 'aufstrich', 'erdnuss', 'cracker', 'salzstangen', 'popcorn', 'bonbons'] },
    { id: 'Drogerie & Haushalt', icon: '🧴', color: '#8a63d2', kw: ['klopapier', 'toilettenpapier', 'küchenrolle', 'küchenpapier', 'spüli', 'spülmittel', 'waschmittel', 'weichspüler', 'shampoo', 'duschgel', 'zahnpasta', 'zahnbürste', 'zahnseide', 'deo', 'seife', 'müllbeutel', 'müllsäcke', 'taschentücher', 'feuchttücher', 'windeln', 'schwamm', 'alufolie', 'frischhaltefolie', 'backpapier', 'batterien', 'creme', 'rasier', 'tabs', 'reiniger', 'tampons', 'binden', 'wattepads', 'gefrierbeutel', 'kerzen'] },
    { id: 'Getränke', icon: '🥤', color: '#1fa395', kw: ['wasser', 'saft', 'bier', 'wein', 'cola', 'limo', 'sprudel', 'eistee', 'sekt', 'mate', 'smoothie', 'schorle', 'radler', 'energy', 'sirup', 'hafermilch', 'sojamilch', 'mandelmilch'] },
    { id: 'Tiefkühl', icon: '🧊', color: '#5a73d6', kw: ['tk', 'tiefkühl', 'pizza', 'eis', 'pommes', 'fischstäbchen', 'kroketten', 'rahmspinat', 'eiswürfel'] },
    { id: 'Sonstiges', icon: '📦', color: '#8a8a80', kw: [] },
  ];
  const catOf = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
  // Gemeinsame Reihenfolge aus der Datenbank, sonst die Standard-Reihenfolge von oben
  const catOrder = () => state.cat_order?.length ? state.cat_order : CATS.map(c => c.id);
  const catIndex = id => { const i = catOrder().indexOf(id); return i < 0 ? CATS.length : i; };

  // Längster passender Begriff gewinnt ("Tomatenmark" → Vorrat, nicht Obst & Gemüse)
  function guessCategory(name) {
    const s = name.toLowerCase().trim();
    if (!s) return null;
    const fav = state.favorites.find(f => f.name.toLowerCase() === s);
    if (fav) return fav.category;
    const tokens = s.split(/[\s,.\-\/+]+/);
    let best = null, bestLen = 0;
    for (const c of CATS) for (const k of c.kw) {
      const hit = k.length <= 3 ? tokens.includes(k) : s.includes(k);
      if (hit && k.length > bestLen) { best = c.id; bestLen = k.length; }
    }
    return best;
  }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let pin = store.get('ek_pin');
  let me = store.get('ek_name') || '';
  let state = { items: [], favorites: [] };
  let catTouched = false;
  const justAdded = new Set();

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

  // --- Sync zwischen den Handys ---
  const channel = sb.channel('einkaufsliste', { config: { broadcast: { self: false } } });
  channel.on('broadcast', { event: 'changed' }, () => { load(); loadCook(); if (tab === 'kasse') loadMoney(); }).subscribe();
  const ping = () => channel.send({ type: 'broadcast', event: 'changed', payload: {} }).catch(() => {});

  async function rpc(fn, args = {}) {
    const { data, error } = await sb.rpc(fn, { p_pin: pin, ...args });
    if (error) {
      if (/invalid pin/.test(error.message)) logout('Die PIN stimmt nicht mehr. Bitte neu anmelden.');
      throw error;
    }
    return data;
  }

  let loading = false, loadAgain = false, busy = 0;
  async function load() {
    if (!pin) return;
    if (loading) { loadAgain = true; return; }
    loading = true;
    try {
      const fresh = await rpc('get_state');
      setOnline(true);
      // während einer Animation nicht dazwischenfunken
      if (!busy) { state = fresh; render(); }
    } catch (e) {
      setOnline(false);
    } finally {
      loading = false;
      if (loadAgain) { loadAgain = false; load(); }
    }
  }

  async function mutate(fn, args, optimistic) {
    if (optimistic) { optimistic(); render(); }
    try {
      await rpc(fn, args);
      ping();
    } catch (e) {
      toast('Hat nicht geklappt – bitte nochmal versuchen.');
    }
    load();
  }

  function setOnline(ok) {
    $('dot').classList.toggle('off', !ok);
    $('dot').title = ok ? 'verbunden' : 'keine Verbindung';
  }

  let toastTimer;
  function toast(msg, actionLabel, action) {
    const t = $('toast');
    t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ''}`;
    if (actionLabel) t.querySelector('button').onclick = () => { t.classList.remove('show'); action(); };
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 4500 : 2600);
  }

  // --- Darstellung ---
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function itemHtml(it) {
    const c = catOf(it.category);
    const by = it.source_recipe ? `<span class="by">${esc(it.source_recipe)}</span>`
      : it.added_by && it.added_by !== me ? `<span class="by">${esc(it.added_by)}</span>` : '';
    const enter = justAdded.has(it.name.toLowerCase()) && !it.checked ? ' enter' : '';
    return `<li class="item${it.checked ? ' done' : ''}${enter}" data-id="${esc(it.id)}" style="--c:${c.color}">
      <div class="swipe-bg">Löschen</div>
      <div class="inner">
        <button class="check" aria-label="${it.checked ? 'Wieder offen' : 'Abhaken'}">${checkSvg}</button>
        <div class="text"><span class="name">${esc(it.name)}</span>${it.remind ? `<span class="rem" title="Rossmann-Erinnerung">${IC.pin}</span>` : ''}${by}</div>
        ${it.qty ? `<span class="qty">${esc(it.qty)}</span>` : ''}
        <button class="del" aria-label="Löschen">×</button>
      </div>
    </li>`;
  }

  function render() {
    const open = state.items.filter(i => !i.checked);
    const done = state.items.filter(i => i.checked)
      .sort((a, b) => String(b.checked_at).localeCompare(String(a.checked_at)));
    const total = state.items.length;

    $('progress').hidden = total === 0;
    $('count').innerHTML = open.length === 0 ? '<b>Alles im Wagen</b>'
      : `<b>${open.length}</b> ${open.length === 1 ? 'Artikel' : 'Artikel'} offen`;
    $('ratio').textContent = `${done.length} von ${total} im Wagen`;
    $('barFill').style.width = total ? `${Math.round(done.length / total * 100)}%` : '0';

    if (open.length === 0) {
      $('list').innerHTML = `<div class="empty"><div class="big">${done.length ? IC.check : IC.cart}</div>
        <strong>${done.length ? 'Alles im Wagen!' : 'Die Liste ist leer'}</strong>
        ${done.length ? 'Nach dem Einkauf auf „Woche fertig“ tippen.' : 'Unten ins Feld tippen – dort erscheinen auch eure häufigsten Artikel.'}</div>`;
    } else {
      const groups = new Map();
      open.sort((a, b) => catIndex(a.category) - catIndex(b.category) || String(a.created_at).localeCompare(String(b.created_at)))
        .forEach(i => {
          const c = catOf(i.category).id;
          if (!groups.has(c)) groups.set(c, []);
          groups.get(c).push(i);
        });
      $('list').innerHTML = [...groups].map(([id, items]) => {
        const c = catOf(id);
        return `<section class="group" style="--c:${c.color}">
          <div class="group-head"><h2>${esc(c.id)}</h2><span class="n">${items.length}</span></div>
          <ul>${items.map(itemHtml).join('')}</ul></section>`;
      }).join('');
    }

    $('done').innerHTML = done.length ? `<div class="done-head"><h2>Im Wagen · ${done.length}</h2>
      <button class="finish" id="clearBtn">Woche fertig</button></div>
      <ul class="done-list">${done.map(itemHtml).join('')}</ul>` : '';

    justAdded.clear();
    renderChips();
  }

  let delModeName = null;
  function renderChips() {
    const q = $('name').value.trim().toLowerCase();
    const onList = new Set(state.items.filter(i => !i.checked).map(i => i.name.toLowerCase()));
    let favs = state.favorites.filter(f => !onList.has(f.name.toLowerCase()));
    if (q) favs = favs.filter(f => f.name.toLowerCase().includes(q) && f.name.toLowerCase() !== q)
      .sort((a, b) => b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q));
    favs = favs.slice(0, q ? 8 : 14);
    $('chipsLabel').textContent = favs.length ? (q ? 'Vorschläge' : 'Oft gekauft · gedrückt halten zum Entfernen') : '';
    $('chips').innerHTML = favs.map(f => {
      const c = catOf(f.category);
      return `<button type="button" class="chip${delModeName === f.name ? ' del-mode' : ''}" data-name="${esc(f.name)}" style="--c:${c.color}">${delModeName === f.name ? '× entfernen' : '<span class="cdot"></span>' + esc(f.name)}</button>`;
    }).join('');
    $('chips').style.display = favs.length ? '' : 'none';
    $('chipsLabel').style.display = favs.length ? '' : 'none';
  }

  function setCat(id) {
    const c = catOf(id);
    $('cat').value = c.id;
    $('catBox').style.setProperty('--c', c.color);
  }

  // Zeile zuklappen, danach weiter
  function collapse(row, then) {
    if (reducedMotion) { then(); return; }
    busy++;
    const h = row.offsetHeight;
    const a = row.animate(
      [{ height: h + 'px', opacity: 1 }, { height: '0px', opacity: 0 }],
      { duration: 240, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' }
    );
    a.onfinish = () => { busy--; then(); };
  }

  // --- Aktionen ---
  function addItem(name, qty, category, remind = false) {
    name = cap(name.trim());
    qty = (qty || '').trim();
    if (!name) return;
    category = category || guessCategory(name) || 'Sonstiges';
    justAdded.add(name.toLowerCase());
    mutate('add_item', { p_name: name, p_qty: qty, p_category: category, p_by: me, p_remind: remind }, () => {
      const ex = state.items.find(i => !i.checked && i.name.toLowerCase() === name.toLowerCase());
      if (ex) { if (qty) ex.qty = qty; ex.category = category; ex.remind = ex.remind || remind; }
      else state.items.push({ id: 'tmp-' + Date.now(), name, qty, category, remind, checked: false, added_by: me, created_at: new Date().toISOString() });
    });
    if (!store.get('ek_tip_edit')) {
      store.set('ek_tip_edit', '1');
      setTimeout(() => toast('Tipp: Artikel gedrückt halten zum Bearbeiten'), 700);
    }
  }

  function toggleItem(row, id) {
    const it = state.items.find(i => i.id === id);
    if (!it) return;
    navigator.vibrate?.(10);
    const apply = () => mutate('toggle_item', { p_id: id }, () => {
      it.checked = !it.checked;
      it.checked_at = new Date().toISOString();
    });
    if (it.checked || reducedMotion) { apply(); return; }
    // Haken zeigen, kurz stehen lassen, dann wegklappen
    row.classList.add('ticking');
    busy++;
    setTimeout(() => { busy--; collapse(row, apply); }, 320);
  }

  function deleteItem(id) {
    const it = state.items.find(i => i.id === id);
    if (!it) return;
    mutate('delete_item', { p_id: id }, () => { state.items = state.items.filter(i => i.id !== id); });
    toast(`„${it.name}“ gelöscht`, 'Rückgängig', () => {
      addItem(it.name, it.qty, it.category, it.remind);
    });
  }

  // Fenster, das von unten hochfährt
  function openSheet(html) {
    const o = document.createElement('div');
    o.className = 'edit-overlay';
    o.innerHTML = `<form class="edit-sheet" autocomplete="off"><div class="grab"></div>${html}</form>`;
    const onKey = e => { if (e.key === 'Escape') close(); };
    function close() {
      document.removeEventListener('keydown', onKey);
      document.activeElement?.blur();
      if (reducedMotion) { o.remove(); return; }
      o.classList.add('closing');
      setTimeout(() => o.remove(), 180);
    }
    document.addEventListener('keydown', onKey);
    o.addEventListener('click', e => { if (!e.target.closest('.edit-sheet')) close(); });
    document.body.append(o);
    return { o, f: o.querySelector('form'), close };
  }

  // Gedrückt halten = Name, Menge und Kategorie ändern
  function openEdit(id) {
    const it = state.items.find(i => i.id === id);
    if (!it || document.querySelector('.edit-overlay')) return;
    let cat = catOf(it.category).id;
    const { o, f, close } = openSheet(`
      <h2>Artikel bearbeiten</h2>
      <div class="edit-row">
        <label><span>Name</span><input name="name" value="${esc(it.name)}" maxlength="80" enterkeyhint="done"></label>
        <label class="q"><span>Menge</span><input name="qty" value="${esc(it.qty || '')}" maxlength="40" placeholder="z. B. 2" inputmode="decimal" enterkeyhint="done"></label>
      </div>
      <div class="qty-bar on" style="margin:-6px 0 14px"></div>
      <label><span>Kategorie</span></label>
      <div class="edit-cats">${CATS.map(c => `<button type="button" class="chip${c.id === cat ? ' on' : ''}" data-cat="${esc(c.id)}" style="--c:${c.color}"><span class="cdot"></span>${esc(c.id)}</button>`).join('')}</div>
      <label class="ktoggle"><input type="checkbox" name="remind" ${it.remind ? 'checked' : ''}> Bei Rossmann erinnern</label>
      <div style="height:14px"></div>
      <div class="edit-actions">
        <button type="button" class="btn-line del-btn">Löschen</button>
        <button type="submit" class="btn-line go">Speichern</button>
      </div>`);
    wireQtyBar(o.querySelector('.qty-bar'), f.elements.qty);
    o.addEventListener('click', e => {
      const chip = e.target.closest('[data-cat]');
      if (chip) {
        cat = chip.dataset.cat;
        f.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('on', b === chip));
        return;
      }
      if (e.target.closest('.del-btn')) { close(); deleteItem(id); }
    });
    f.addEventListener('submit', e => {
      e.preventDefault();
      const name = cap(f.elements.name.value.trim()), qty = f.elements.qty.value.trim();
      if (!name) { f.elements.name.focus(); return; }
      close();
      const remind = f.elements.remind.checked;
      if (remind !== !!it.remind) mutate('set_remind', { p_id: id, p_on: remind }, () => {
        const cur = state.items.find(i => i.id === id);
        if (cur) cur.remind = remind;
      });
      if (name === it.name && qty === (it.qty || '') && cat === catOf(it.category).id) return;
      mutate('update_item', { p_id: id, p_name: name, p_qty: qty, p_category: cat }, () => {
        const cur = state.items.find(i => i.id === id);
        if (cur) Object.assign(cur, { name, qty, category: cat });
        const fav = state.favorites.find(x => x.name.toLowerCase() === name.toLowerCase());
        if (fav) fav.category = cat;
      });
    });
  }

  // 📍 = beim nächsten Artikel an Rossmann erinnern
  let remindNext = false;
  function setRemindNext(on) {
    remindNext = on;
    $('pinBtn').classList.toggle('on', on);
    $('pinBtn').setAttribute('aria-pressed', String(on));
  }
  $('pinBtn').addEventListener('click', () => {
    setRemindNext(!remindNext);
    if (remindNext) toast('Wird an der Haltestelle bei Rossmann gemeldet');
  });

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    addItem($('name').value, $('qty').value, catTouched ? $('cat').value : null, remindNext);
    $('name').value = '';
    $('qty').value = '';
    setRemindNext(false);
    catTouched = false;
    setCat('Sonstiges');
    $('addBtn').disabled = true;
    renderChips();
    $('name').focus();
  });

  $('name').addEventListener('input', () => {
    const v = $('name').value;
    $('addBtn').disabled = !v.trim();
    if (!catTouched) setCat(guessCategory(v) || 'Sonstiges');
    delModeName = null;
    renderChips();
  });
  $('cat').addEventListener('change', () => { catTouched = true; setCat($('cat').value); });

  // Menge: Zahlentastatur hat kein Minus – darum eine Leiste mit „bis“ (1–2) und Einheiten.
  // Die Knöpfe nehmen dem Feld den Fokus nicht weg, die Tastatur bleibt offen.
  const QTY_KEYS = ['–', 'g', 'kg', 'l', 'Pck.'];
  function wireQtyBar(bar, input) {
    bar.innerHTML = QTY_KEYS.map(t => `<button type="button" data-q="${t}">${t === '–' ? '– bis' : t}</button>`).join('');
    const press = e => {
      const b = e.target.closest('[data-q]');
      if (!b) return;
      e.preventDefault();
      const v = input.value.replace(/[\s–-]+$/, '');
      input.value = b.dataset.q === '–' ? (v || '1') + '–' : (v ? v + ' ' : '') + b.dataset.q;
      input.focus();
    };
    bar.addEventListener('touchstart', press, { passive: false });
    bar.addEventListener('mousedown', press);
  }
  wireQtyBar($('qtyBar'), $('qty'));
  $('qty').addEventListener('focus', () => $('addForm').classList.add('qtyfocus'));
  $('qty').addEventListener('blur', () => $('addForm').classList.remove('qtyfocus'));

  // „Oft gekauft“ nur zeigen, solange jemand etwas einträgt
  $('addForm').addEventListener('focusin', () => $('addForm').classList.add('typing'));
  document.addEventListener('pointerdown', e => {
    if (e.target.closest('#addForm')) $('addForm').classList.add('typing');
    else if (!$('name').value.trim()) $('addForm').classList.remove('typing');
  });

  // Chips: tippen = hinzufügen, gedrückt halten = Entfernen anbieten
  let pressTimer = null, pressed = false;
  $('chips').addEventListener('pointerdown', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    pressed = false;
    pressTimer = setTimeout(() => { pressed = true; delModeName = chip.dataset.name; renderChips(); navigator.vibrate?.(15); }, 550);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => $('chips').addEventListener(t, () => clearTimeout(pressTimer)));
  $('chips').addEventListener('contextmenu', e => e.preventDefault());
  $('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    if (pressed) { pressed = false; return; }
    const name = chip.dataset.name;
    if (delModeName === name) {
      delModeName = null;
      mutate('delete_favorite', { p_name: name }, () => { state.favorites = state.favorites.filter(f => f.name !== name); });
      return;
    }
    delModeName = null;
    const fav = state.favorites.find(f => f.name === name);
    addItem(name, $('qty').value, fav?.category, remindNext);
    $('name').value = ''; $('qty').value = ''; $('addBtn').disabled = true;
    setRemindNext(false);
    catTouched = false; setCat('Sonstiges');
  });

  // Nach links wischen = löschen, gedrückt halten = bearbeiten
  let sw = null, suppressClick = false, holdTimer = null, held = false;
  document.addEventListener('pointerdown', e => {
    held = false;
    clearTimeout(holdTimer);
    const inner = e.target.closest('.item .inner');
    if (!inner || e.button > 0 || inner.parentElement.dataset.id.startsWith('tmp-')) return;
    const s = sw = { inner, row: inner.parentElement, x0: e.clientX, y0: e.clientY, dx: 0, active: false };
    holdTimer = setTimeout(() => {
      if (sw !== s || s.active) return;  // inzwischen gescrollt, gewischt oder losgelassen
      sw = null; held = true;
      navigator.vibrate?.(15);
      openEdit(s.row.dataset.id);
    }, 500);
  });
  document.addEventListener('contextmenu', e => {
    const row = e.target.closest('.item');
    if (!row) return;
    e.preventDefault();
    if (!row.dataset.id.startsWith('tmp-')) { held = true; openEdit(row.dataset.id); }
  });
  document.addEventListener('pointermove', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.active) {
      if (dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        sw.active = true;
        busy++;
        sw.row.classList.add('swiping');
        try { sw.inner.setPointerCapture(e.pointerId); } catch {}
      } else if (Math.abs(dy) > 10 || dx > 10) { sw = null; return; }
      else return;
    }
    sw.dx = Math.min(0, dx);
    sw.inner.style.transform = `translateX(${sw.dx}px)`;
    const armed = sw.dx < -90;
    if (armed !== sw.row.classList.contains('armed')) { sw.row.classList.toggle('armed', armed); if (armed) navigator.vibrate?.(8); }
  });
  function endSwipe() {
    if (!sw) return;
    const s = sw; sw = null;
    if (!s.active) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);
    busy--;
    if (s.dx < -90) {
      s.inner.style.transition = 'transform .18s ease-in';
      s.inner.style.transform = 'translateX(-105%)';
      setTimeout(() => collapse(s.row, () => deleteItem(s.row.dataset.id)), 170);
    } else {
      s.inner.style.transition = 'transform .28s cubic-bezier(.2, .9, .3, 1.2)';
      s.inner.style.transform = '';

  function confetti() {
    if (reducedMotion) return;
    const cv = document.createElement('canvas');
    cv.className = 'confetti';
    document.body.append(cv);
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const colors = CATS.slice(0, -1).map(c => c.color);
    const parts = Array.from({ length: 150 }, (_, i) => {
      const side = i % 2 ? 1 : -1;
      return {
        x: side > 0 ? W * .1 : W * .9, y: H * .7,
        vx: side * (Math.random() * 9 + 3), vy: -(Math.random() * 15 + 9),
        w: Math.random() * 7 + 5, h: Math.random() * 4 + 3,
        c: colors[Math.random() * colors.length | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .35,
      };
    });
    const t0 = performance.now(), dur = 2200;
    (function frame(t) {
      const el = t - t0;
      ctx.clearRect(0, 0, W, H);
      for (const p of parts) {
        p.vy += .42; p.vx *= .985; p.vy *= .99;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el - dur * .6) / (dur * .4));
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (el < dur) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

    const unit = (d.match(/^[\d,\s\-–]+(.*)$/) || [, ''])[1].trim();
    if (/^(geh\.\s*)?(TL|EL)$|^Prisen?$|^Msp\.?$|^Spritzer$|^Stängel$/i.test(unit)) return '';

    if (parsed.length && parsed.every(m => m && m[2] === parsed[0][2])) {
      const sum = parsed.reduce((s, m) => s + parseFloat(m[1].replace(',', '.')), 0);
      return `${String(Math.round(sum * 100) / 100).replace('.', ',')} ${parsed[0][2]}`.trim();

    return [...new Set(list.filter(Boolean))].join(' + ');

      if (!byName.has(n)) byName.set(n, { name: cap(i.name.trim()), qtys: [] });
      byName.get(n).qtys.push(shoppingQty(i.description));

    if (act === 'view') { cookView = t.dataset.v; window.scrollTo(0, 0); renderCook(); if (cookView === 'stoebern') loadCatalog(); return; }
    if (act === 'fchip') { filter.chip = t.dataset.v; shown = PAGE; renderCook(); return; }
    if (act === 'fveg') { filter.veg = !filter.veg; shown = PAGE; renderCook(); return; }
    if (act === 'ftime') { const m = t.dataset.v.includes('30') ? 30 : 45; filter.time = filter.time === m ? 0 : m; shown = PAGE; renderCook(); return; }
    if (act === 'more') { shown += PAGE; renderGrid(); return; }

    if (act === 'heart') {
      const s = stateOf(id);
      const r = catalog.find(x => x.id === id);
      if (s.plan) { toast('Steht schon auf dem Plan 🍽️'); return; }
      if (s.mine) {
        kochen.open = kochen.open.filter(p => p !== s.mine);
        renderGrid();
        await rpc('withdraw', { p_person: me, p_id: s.mine.id });
        ping();
        toast('Vorschlag zurückgezogen');
        return;
      }
      navigator.vibrate?.(10);
      t.classList.add('on', 'pop');
      t.innerHTML = ICONS.heartFull;
      const res = await rpc('propose', { p_person: me, p_recipe: id });
      if (res.result === 'match') {
        kochen.open = kochen.open.filter(p => p.id !== res.proposal.id);
        kochen.plan.push(res.proposal);
        renderGrid();
        await planned(res.proposal, '💚 Ihr wollt beide!', `${res.proposal.proposed_by} hatte das auch vorgeschlagen.`);
      } else {
        if (res.result === 'proposed') kochen.open.unshift(res.proposal);
        renderGrid();
        ping();
        toast(`Vorgeschlagen 💌 ${r ? '„' + r.name + '“' : ''}`);
      }
      return;
    }

    if ((act === 'decide-yes' || act === 'decide-no') && prop) {
      const yes = act === 'decide-yes';
      const card = t.closest('.dcard');
      card?.classList.add(yes ? 'out-yes' : 'out-no');
      navigator.vibrate?.(yes ? [8, 40, 8] : 8);
      kochen.open = kochen.open.filter(p => p.id !== id);
      updateBadge();
      const res = await rpc('decide', { p_person: me, p_id: id, p_yes: yes });
      setTimeout(renderCook, 280);
      if (yes && res) {
        kochen.plan.push(res);
        await planned(res, '🍽️ Kommt auf den Plan', 'Gute Wahl!');
      } else {
        ping();
        if (!yes) toast('Okay, diesmal nicht');
      }
      return;
    }

    if (act === 'withdraw' && prop) {
      kochen.open = kochen.open.filter(p => p.id !== id);
      renderCook();
      await rpc('withdraw', { p_person: me, p_id: id });
      ping();
      return;
    }
    if (act === 'cooked' && prop) {
      kochen.plan = kochen.plan.filter(p => p.id !== id);
      renderCook();
      await rpc('mark_cooked', { p_id: id });
      ping();
      toast(`Lecker! „${prop.name}“ ist abgehakt`);
      return;
    }
    if (act === 'unplan' && prop) {
      kochen.plan = kochen.plan.filter(p => p.id !== id);
      renderCook();
      await rpc('unplan', { p_id: id });
      ping();
      toast(`„${prop.name}“ vom Plan genommen`);
      return;
    }
    if (act === 'readd' && prop) {
      const n = await addIngredients(prop);
      ping();
      toast(n ? `${n} Zutaten auf die Liste gesetzt` : 'Alles schon im Haus');
      return;
    }
  }

  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  async function renderPushState() {
    const el = $('pushState'), sub = $('pushSub');
    if (!el) return;
    // Längere Hinweise stehen klein unter dem Titel, rechts nur Status oder Knopf
    const note = t => { el.innerHTML = ''; if (sub) sub.textContent = t; };
    if (!pushSupported()) {
      note(/iPhone|iPad/.test(navigator.userAgent) && !isStandalone()
        ? 'Geht nur, wenn die App auf dem Home-Bildschirm liegt: Teilen → „Zum Home-Bildschirm“, dann von dort öffnen.'
        : 'Dieser Browser kann keine Mitteilungen.');
      return;
    }
    let on = false;
    try { on = Notification.permission === 'granted' && !!(await (await navigator.serviceWorker.ready).pushManager.getSubscription()); } catch {}
    if (Notification.permission === 'denied' && !on) { note('Mitteilungen sind blockiert. Erlaube sie in den Handy-Einstellungen für diese App.'); return; }
    el.innerHTML = on ? '<span class="ok-line">An</span>' : '<button class="btn-line go sm" data-m="push">Einschalten</button>';
  }

  async function enablePush() {
    try {
      if (await Notification.requestPermission() !== 'granted') { renderPushState(); return; }
      const reg = await navigator.serviceWorker.ready;
      const key = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
      const j = sub.toJSON();
      await rpc('save_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_person: me });
      toast('Erinnerung ist an 🔔');
    } catch {
      toast('Hat nicht geklappt – bitte nochmal versuchen.');
    }
    renderPushState();
  }

    // „1.000,50“ und „1.000“ sind deutsch, „12.5“ ist ein Dezimalpunkt
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    const n = Number(s);
    return Number.isFinite(n) && n > 0 && n < 1e7 ? Math.round(n * 100) / 100 : null;
  }

  // Anteil, den eine Person trägt (Ausgabe) bzw. der ihr zusteht (Einnahme)
  // Bei „je ½“ und ungeradem Betrag trägt, wer bezahlt hat, den übrigen Cent – so bleibt alles in ganzen Cent
  const shareOf = (e, p) => {
    const a = cents(e), h = Math.floor(a / 2);
    return e.share === 'beide' ? (p === e.paid_by ? a - h : h) : e.share === p ? a : 0;
  };
  const paidOf = (e, p) => e.paid_by === p ? cents(e) : 0;
  function effect(e) {
    const p = PEOPLE[0];
    return e.kind === 'einnahme' ? shareOf(e, p) - paidOf(e, p) : paidOf(e, p) - shareOf(e, p);
  }

  let moneyReq = null;
  function loadMoney() {
    if (!pin) return Promise.resolve();
    return moneyReq ||= (async () => {
      try {
        const wasCurrent = !money || kMonth === money.month;
        money = await rpc('get_money');
        // Wer den laufenden Monat ansieht, wandert beim Monatswechsel mit
        if (!kMonth || wasCurrent || kMonth > money.month) kMonth = money.month;
        if (tab === 'kasse') renderKasse();
      } catch {} finally { moneyReq = null; }
    })();
  }

  async function moneyMutate(fn, args) {
    try { await rpc(fn, args); ping(); }
    catch { toast('Hat nicht geklappt – bitte nochmal versuchen.'); }
    await loadMoney();
  }

  function renderKasse() {
    const el = $('kasse');
    if (!money) { el.innerHTML = `<div class="cook-empty"><div class="big">${IC.wallet}</div><strong>Lädt …</strong></div>`; return; }
    const bal = money.entries.reduce((s, e) => s + effect(e), 0);
    const even = Math.abs(bal) < 1;
    // Alles aus Sicht dessen, der gerade Guthaben hat
    const P = even ? meP() : bal > 0 ? PEOPLE[0] : PEOPLE[1], O = other(P);
    const sign = P === PEOPLE[0] ? 1 : -1;
    const fmt = c => (c < -0.5 ? '−' : '') + euro(Math.abs(c));
    const cls = c => c > 0.5 ? 'plus' : c < -0.5 ? 'minus' : 'zero';

    const chrono = [...money.entries].sort((a, b) => a.day.localeCompare(b.day) || String(a.created_at).localeCompare(String(b.created_at)));
    const opening = sign * chrono.filter(e => e.day < kMonth).reduce((s, e) => s + effect(e), 0);
    const inMonth = chrono.filter(e => ym(e.day) === ym(kMonth));
    const sum = k => inMonth.filter(e => e.kind === k).reduce((s, e) => s + cents(e), 0);

    let run = opening;
    const row = e => {
      const d = sign * effect(e);
      run += d;
      const part = e.share === 'beide' ? 'je ½' : `nur ${esc(e.share)}`;
      const what = e.kind === 'ausgleich' ? `Geldübergabe ${esc(e.paid_by)} → ${esc(e.share)}`
        : `${euro(cents(e))} · ${esc(e.paid_by)} hat ${e.kind === 'einnahme' ? 'bekommen' : 'bezahlt'}, ${part}`;
      const day = e.fixed_id ? 'Fix ·' : new Date(e.day + 'T12:00').toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' }) + ' ·';
      return `<div class="mrow" data-k="entry" data-id="${esc(e.id)}">
        <div class="kicon ${e.kind === 'einnahme' ? 'in' : ''}">${micon(e)}</div>
        <div class="mt"><b>${esc(e.title)}</b><span>${day} ${what}</span></div>
        <div class="kright"><b class="${cls(d)}">${Math.abs(d) < 0.5 ? '±0' : (d > 0 ? '+' : '') + fmt(d)}</b><small>${fmt(run)}</small></div></div>`;
    };
    const rows = inMonth.map(row).join('');
    const isNow = kMonth === money.month;
    const fixedMonthly = money.fixed.filter(f => !f.until || f.until > money.month)
      .reduce((s, f) => s + (f.kind === 'einnahme' ? -1 : 1) * cents(f), 0);

    el.innerHTML = `
      <div class="kbal${even ? ' even' : ''}">
        <small>${even ? 'Stand zwischen euch' : `Guthaben von ${esc(P)} bei ${esc(O)}`}</small>
        <span class="big">${even ? '0,00 €' : euro(Math.abs(bal))}</span>
        <span class="who">${even ? 'Ihr seid quitt' : `${esc(O)} verrechnet damit ${esc(P)}s Anteile`}</span>
        <button class="settle" data-k="settle">Geld übergeben</button>
      </div>

      <div class="kmonth">
        <button data-k="prev" aria-label="Vormonat">‹</button>
        <h2>${monthName(kMonth)}</h2>
        <button data-k="next" aria-label="Nächster Monat" ${isNow ? 'disabled' : ''}>›</button>
      </div>
      <div class="kstats">
        <div><small>Ausgaben</small><b>${euro(sum('ausgabe'))}</b></div>
        <div><small>Einnahmen</small><b>${euro(sum('einnahme'))}</b></div>
        <div><small>Übergeben</small><b>${euro(sum('ausgleich'))}</b></div>
      </div>

      <div class="section-title">Kontoauszug</div>
      <div class="section-sub">So ändert sich ${esc(P)}s Guthaben bei ${esc(O)}. Rechts steht der neue Stand nach jedem Eintrag.</div>
      <div class="mlist klist">
        <div class="kcarry"><span>Übertrag aus ${monthName(addMonths(kMonth, -1)).split(' ')[0]}</span><b class="${cls(opening)}">${fmt(opening)}</b></div>
        ${rows || '<div class="kempty">Noch nichts eingetragen in diesem Monat.</div>'}
        <div class="kcarry end"><span>${isNow ? 'Stand heute' : `Stand Ende ${monthName(kMonth).split(' ')[0]}`}</span><b class="${cls(run)}">${fmt(run)}</b></div>
      </div>

      ${money.fixed.length ? `<div class="section-title">Fixkosten verwalten</div>
      <div class="section-sub">Pro Monat ${euro(fixedMonthly)} · Änderungen gelten ab diesem Monat</div>
      <div class="mlist klist">${money.fixed.map(f => `
        <div class="mrow" data-k="fixed" data-id="${esc(f.id)}">
          <div class="kicon ${f.kind === 'einnahme' ? 'in' : ''}">${micon(f)}</div>
          <div class="mt"><b>${esc(f.title)}</b><span>${esc(f.paid_by)} ${f.kind === 'einnahme' ? 'bekommt' : 'zahlt'} · ${shareLabel(f.share)}${f.until ? ' · endet nach diesem Monat' : ''}</span></div>
          <div class="kamt ${f.kind === 'einnahme' ? 'in' : ''}">${euro(cents(f))}</div></div>`).join('')}</div>` : ''}

      <div class="kfab"><div class="wrap"><button data-k="add">+ Ausgabe oder Einnahme</button></div></div>`;
  }

  function kasseAction(act, t) {
    if (act === 'prev') { kMonth = addMonths(kMonth, -1); renderKasse(); return; }
    if (act === 'next') { kMonth = addMonths(kMonth, 1); renderKasse(); return; }
    if (act === 'add') { openMoneySheet(null); return; }
    if (act === 'settle') { openSettleSheet(); return; }
    if (act === 'entry') {
      const e = money.entries.find(x => x.id === t.dataset.id);
      if (e) e.kind === 'ausgleich' ? openSettleSheet(e) : openMoneySheet(e);
      return;
    }
    if (act === 'fixed') {
      const f = money.fixed.find(x => x.id === t.dataset.id);
      if (f) openMoneySheet(f, { template: true });
    }
  }

  const seg = (name, opts, val, cls = '') => `<div class="seg ${cls}" data-seg="${name}">${opts.map(([v, l]) =>
    `<button type="button" data-v="${esc(v)}" class="${v === val ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const segVal = (f, name) => f.querySelector(`[data-seg="${name}"] .on`)?.dataset.v;
  function segClicks(o, onChange) {
    o.addEventListener('click', e => {
      const b = e.target.closest('.seg button');
      if (!b) return;
      b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      onChange?.(b.parentElement.dataset.seg, b.dataset.v);
    });
  }

  // Ausgabe/Einnahme anlegen oder ändern; mit template = Fixkosten-Vorlage
  function openMoneySheet(e, opt = {}) {
    if (!money) { loadMoney().then(() => money && openMoneySheet(e, opt)); return; }
    if (document.querySelector('.edit-overlay')) return;
    const isNew = !e, tpl = !!opt.template;
    const v = e || { kind: 'ausgabe', title: opt.title || '', amount: '', paid_by: meP(), share: 'beide', category: opt.category || '' };
    const curMonth = ym(kMonth) === ym(money.month);
    const defDay = curMonth ? todayIso() : kMonth;
    const amountStr = v.amount ? Number(v.amount).toFixed(2).replace('.', ',') : '';
    const what = WHAT.find(w => v.title === w.id || v.title.startsWith(w.id + ' '))?.id || (v.title ? 'Sonstiges' : '');
    const { o, f, close } = openSheet(`
      <h2>${tpl ? (isNew ? 'Neue Fixkosten' : 'Fixkosten ändern') : isNew ? 'Neuer Eintrag' : 'Eintrag ändern'}</h2>
      ${seg('kind', [['ausgabe', '− Ausgabe'], ['einnahme', '+ Einnahme']], v.kind, 'kind')}
      <div class="edit-row">
        <label class="amount" style="flex:1"><span>Betrag</span><input name="amount" inputmode="decimal" placeholder="0,00" value="${esc(amountStr)}" enterkeyhint="next"></label>
      </div>
      <label><span>Wofür</span></label>
      <div class="kwhat">
        <button type="button" class="kwhat-btn${what ? '' : ' empty'}"><span class="kwhat-val">${what ? `${WHAT.find(w => w.id === what).icon} ${what}` : 'Bitte auswählen'}</span><span aria-hidden="true">▾</span></button>
        <div class="kwhat-list" hidden>${WHAT.map(w => `<button type="button" data-what="${w.id}" class="${w.id === what ? 'on' : ''}">${w.icon} ${w.id}</button>`).join('')}</div>
      </div>
      <label><input name="title" maxlength="80" value="${esc(v.title)}" placeholder="Bezeichnung, frei ergänzbar" enterkeyhint="done"></label>
      <label><span class="lbl-paid">${v.kind === 'einnahme' ? 'Bekommen hat' : 'Bezahlt hat'}</span></label>
      ${seg('paid', PEOPLE.map(p => [p, esc(p)]), v.paid_by)}
      <label><span class="lbl-share">${v.kind === 'einnahme' ? 'Steht zu' : 'Wer trägt die Kosten'}</span></label>
      ${seg('share', [['beide', 'Beide je ½'], ...PEOPLE.map(p => [p, 'nur ' + esc(p)])], v.share)}
      <div class="mcats" ${v.kind === 'einnahme' ? 'hidden' : ''}>
        <label><span>Kategorie</span></label>
        <div class="edit-cats">${MCATS.map(c => `<button type="button" class="chip${c.id === v.category ? ' on' : ''}" data-mcat="${esc(c.id)}" style="--c:var(--accent)">${esc(c.id)}</button>`).join('')}</div>
      </div>
      ${tpl || e?.fixed_id ? '' : `<label><span>Datum</span><input name="day" type="date" value="${esc(e ? e.day : defDay)}"></label>`}
      ${isNew && !tpl ? `<label class="ktoggle"><input type="checkbox" name="monthly"> Jeden Monat (Fixkosten)</label><div style="height:14px"></div>` : ''}
      ${e?.fixed_id ? `<p class="khint">Fixkosten: Diese Änderung gilt nur für ${monthName(kMonth)}. Dauerhaft änderst du sie unter „Fixkosten verwalten“.</p>` : ''}
      ${tpl && !isNew ? `<p class="khint">Änderungen gelten ab ${monthName(money.month)}, frühere Monate bleiben, wie sie waren.</p>` : ''}
      <div class="edit-actions">
        ${isNew ? '' : `<button type="button" class="btn-line del-btn">${tpl ? 'Beenden' : 'Löschen'}</button>`}
        <button type="submit" class="btn-line go">Speichern</button>
      </div>
      ${tpl && !isNew ? `<button type="button" class="link-del">Aus Versehen angelegt? Ganz löschen</button>` : ''}`);
    let cat = v.category || '';
    segClicks(o, (name, val) => {
      if (name !== 'kind') return;
      const inc = val === 'einnahme';
      o.querySelector('.lbl-paid').textContent = inc ? 'Bekommen hat' : 'Bezahlt hat';
      o.querySelector('.lbl-share').textContent = inc ? 'Steht zu' : 'Wer trägt die Kosten';
      o.querySelector('.mcats').hidden = inc;
    });
    const setCatChip = c => {
      cat = c;
      o.querySelectorAll('[data-mcat]').forEach(b => b.classList.toggle('on', b.dataset.mcat === cat));
    };
    o.addEventListener('click', ev => {
      const list = o.querySelector('.kwhat-list');
      if (ev.target.closest('.kwhat-btn')) { list.hidden = !list.hidden; return; }
      const w = WHAT.find(x => x.id === ev.target.closest('[data-what]')?.dataset.what);
      if (w) {
        list.hidden = true;
        const btn = o.querySelector('.kwhat-btn');
        btn.classList.remove('empty');
        btn.querySelector('.kwhat-val').innerHTML = `${w.icon} ${w.id}`;
        list.querySelectorAll('[data-what]').forEach(b => b.classList.toggle('on', b === ev.target.closest('[data-what]')));
        if (w.cat) setCatChip(w.cat);
        // „Sonstiges“: gleich selbst schreiben, sonst Vorschlag eintragen (bleibt ergänzbar)
        f.elements.title.value = w.id === 'Sonstiges' ? '' : w.id;
        if (w.id === 'Sonstiges') f.elements.title.focus();
        return;
      }
      if (!ev.target.closest('.kwhat')) list.hidden = true;
      const c = ev.target.closest('[data-mcat]');
      if (c) {
        setCatChip(c.classList.contains('on') ? '' : c.dataset.mcat);
        if (!f.elements.title.value.trim() && cat) f.elements.title.placeholder = cat;
        return;
      }
      if (ev.target.closest('.del-btn')) {
        close();
        if (tpl) { moneyMutate('end_fixed', { p_id: e.id, p_remove: false }); toast(`„${e.title}“ endet nach diesem Monat`); }
        else {
          moneyMutate('delete_entry', { p_id: e.id });
          toast(`„${e.title}“ gelöscht`, 'Rückgängig', () => moneyMutate('delete_entry', { p_id: e.id, p_restore: true }));
        }
        return;
      }
      const ld = ev.target.closest('.link-del');
      if (ld) {
        if (!ld.classList.contains('armed')) { ld.classList.add('armed'); ld.textContent = 'Wirklich löschen? Auch alle früheren Monate. Nochmal tippen'; return; }
        close();
        moneyMutate('end_fixed', { p_id: e.id, p_remove: true });
      }
    });
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      const amount = parseAmount(f.elements.amount.value);
      if (!amount) { f.elements.amount.focus(); toast('Bitte einen Betrag eingeben, z. B. 12,50'); return; }
      const kind = segVal(f, 'kind');
      const title = f.elements.title.value.trim() || (kind === 'einnahme' ? 'Einnahme' : cat || 'Ausgabe');
      const args = { p_kind: kind, p_title: title, p_amount: amount, p_paid_by: segVal(f, 'paid'), p_share: segVal(f, 'share'), p_category: kind === 'einnahme' ? '' : cat };
      close();
      if (tpl || f.elements.monthly?.checked) {
        moneyMutate('save_fixed', { p_id: tpl && !isNew ? e.id : null, ...args, p_from: kMonth });
        if (isNew) toast(`„${title}“ kommt jetzt jeden Monat`);
      } else {
        moneyMutate('save_entry', { p_id: e ? e.id : null, ...args, p_day: f.elements.day?.value || null, p_by: me });
      }
    });
    if (isNew) setTimeout(() => f.elements.amount.focus(), 320);
  }

  // Überweisung zwischen euch eintragen
  function openSettleSheet(e) {
    if (document.querySelector('.edit-overlay')) return;
    const bal = money.entries.filter(x => x !== e).reduce((s, x) => s + effect(x), 0);
    const from = e ? e.paid_by : meP();
    const amt = e ? cents(e) : 0;
    const zeroFrom = bal > 0 ? PEOPLE[1] : PEOPLE[0];
    const { o, f, close } = openSheet(`
      <h2>${e ? 'Geldübergabe ändern' : 'Geld übergeben'}</h2>
      <p class="khint">Tragt hier ein, wenn einer dem anderen Geld überwiesen oder bar gegeben hat, z. B. als Guthaben für kommende Kosten.</p>
      ${seg('from', PEOPLE.map(p => [p, `${esc(p)} → ${esc(other(p))}`]), from)}
      <label class="amount"><span>Betrag</span><input name="amount" inputmode="decimal" placeholder="0,00" value="${amt ? (amt / 100).toFixed(2).replace('.', ',') : ''}"></label>
      ${!e && Math.abs(bal) >= 1 ? `<button type="button" class="link-del zero-btn" style="margin:-6px 0 14px">Alles ausgleichen: ${esc(zeroFrom)} gibt ${esc(other(zeroFrom))} ${euro(Math.abs(bal))}</button>` : ''}
      <label><span>Datum</span><input name="day" type="date" value="${esc(e ? e.day : todayIso())}"></label>
      <div class="edit-actions">
        ${e ? '<button type="button" class="btn-line del-btn">Löschen</button>' : ''}
        <button type="submit" class="btn-line go">Ausgleich speichern</button>
      </div>`);
    segClicks(o);
    o.addEventListener('click', ev => {
      if (ev.target.closest('.zero-btn')) {
        o.querySelectorAll('[data-seg="from"] button').forEach(b => b.classList.toggle('on', b.dataset.v === zeroFrom));
        f.elements.amount.value = (Math.round(Math.abs(bal)) / 100).toFixed(2).replace('.', ',');
        return;
      }
      if (!ev.target.closest('.del-btn')) return;
      close();
      moneyMutate('delete_entry', { p_id: e.id });
      toast('Geldübergabe gelöscht', 'Rückgängig', () => moneyMutate('delete_entry', { p_id: e.id, p_restore: true }));
    });
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      const amount = parseAmount(f.elements.amount.value);
      if (!amount) { f.elements.amount.focus(); return; }
      const p = segVal(f, 'from');
      close();
      moneyMutate('save_entry', { p_id: e ? e.id : null, p_kind: 'ausgleich', p_title: `${p} gibt ${other(p)} Geld`, p_amount: amount, p_paid_by: p, p_share: other(p), p_category: '', p_day: f.elements.day.value || null, p_by: me });
      if (!e) toast(`${p} hat ${other(p)} ${euro(amount * 100)} gegeben`);
    });
  }

  // --- Anmeldung ---
  function logout(msg) {
    pin = null;
    store.del('ek_pin');
    $('loginName').value = me;
    $('loginPin').value = '';
    $('loginErr').textContent = msg || '';
    $('login').hidden = false;
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('loginName').value.trim();
    const p = $('loginPin').value;
    $('loginErr').textContent = '';
    if (p.length < 4) { $('loginErr').textContent = 'Die PIN braucht mindestens 4 Zeichen.'; return; }
    const { data, error } = await sb.rpc('login', { p_pin: p });
    if (error) {
      $('loginErr').textContent = /invalid pin/.test(error.message) ? 'PIN stimmt nicht.' : 'Keine Verbindung – bitte nochmal versuchen.';
      return;
    }
    pin = p; me = name;
    store.set('ek_pin', p); store.set('ek_name', name);
    renderMenu();
    $('login').hidden = true;
    if (data === 'created') toast('PIN festgelegt – gib sie deiner Freundin.');
    load();
    loadCook();
    setTimeout(loveNote, 700);
  });

  // --- Start ---
  $('date').textContent = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
  $('cat').innerHTML = CATS.map(c => `<option value="${esc(c.id)}">${esc(c.id)}</option>`).join('');
  setCat('Sonstiges');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (['#kochen', '#kasse', '#mehr'].includes(location.hash)) setTab(location.hash.slice(1));

  if (pin) { renderMenu(); load(); loadCook(); setTimeout(loveNote, 700); }
  else logout();

  const refresh = () => { if (!document.hidden) { load(); loadCook(); loveNote(); if (tab === 'kasse') loadMoney(); } };
  setInterval(refresh, 15000);
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('focus', refresh);
</script>
</body>
</html>
