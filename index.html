<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einkaufsliste</title>
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --ink: #1b1d1a;
    --muted: #80837c;
    --line: #ece8e0;
    --accent: #1f9254;
    --accent-2: #4cc27a;
    --accent-ink: #ffffff;
    --danger: #e0533f;
    --shadow-sm: 0 1px 2px rgba(40, 35, 20, .05);
    --shadow: 0 1px 2px rgba(40, 35, 20, .04), 0 10px 30px -8px rgba(40, 35, 20, .12);
    --shadow-lg: 0 2px 6px rgba(40, 35, 20, .06), 0 24px 48px -12px rgba(40, 35, 20, .22);
    --tint: 13%;
    --tint-strong: 24%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121412;
      --surface: #1c1f1c;
      --ink: #eeede8;
      --muted: #979a93;
      --line: #2a2e2a;
      --accent: #43c47a;
      --accent-2: #7fdca2;
      --accent-ink: #0b1a10;
      --danger: #f0705c;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -8px rgba(0, 0, 0, .5);
      --shadow-lg: 0 2px 6px rgba(0, 0, 0, .35), 0 24px 48px -12px rgba(0, 0, 0, .6);
      --tint: 16%;
      --tint-strong: 30%;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 500 16px/1.4 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  /* weiche Farbflecken im Hintergrund */
  body::before {
    content: ""; position: fixed; inset: -20% -20% auto; height: 70vh; z-index: -1; pointer-events: none;
    background:
      radial-gradient(40% 50% at 15% 30%, color-mix(in srgb, #4cc27a 20%, transparent), transparent 70%),
      radial-gradient(35% 45% at 85% 20%, color-mix(in srgb, #f2a93b 18%, transparent), transparent 70%),
      radial-gradient(30% 40% at 60% 60%, color-mix(in srgb, #5aa8e6 14%, transparent), transparent 70%);
    filter: blur(10px);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .wrap { max-width: 560px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }

  /* ---------- Kopf ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    backdrop-filter: saturate(1.6) blur(18px);
    -webkit-backdrop-filter: saturate(1.6) blur(18px);
  }
  .head { display: flex; align-items: flex-start; justify-content: space-between; padding-top: 20px; padding-bottom: 14px; gap: 12px; }
  .date { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .01em; display: flex; align-items: center; gap: 7px; }
  h1 { margin: 2px 0 0; font-size: 36px; line-height: 1.05; letter-spacing: -.035em; font-weight: 800; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .dot.off { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 20%, transparent); }
  .icon-btn {
    flex: none; width: 42px; height: 42px; border-radius: 14px; border: 0; margin-top: 6px;
    background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 20px; line-height: 1;
  }

  .progress { padding-bottom: 14px; }
  .progress[hidden] { display: none; }
  .progress-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 7px; }
  .progress-top b { color: var(--ink); font-weight: 700; }
  .bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .5s cubic-bezier(.2, .8, .2, 1); }

  .menu {
    position: absolute; right: 16px; top: calc(env(safe-area-inset-top) + 70px);
    background: var(--surface); border-radius: 18px; box-shadow: var(--shadow-lg);
    padding: 6px; min-width: 230px; display: none; transform-origin: top right;
  }
  .menu.open { display: block; animation: pop .18s ease-out; }
  .menu .who { padding: 10px 12px 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .menu button { display: block; width: 100%; text-align: left; padding: 11px 12px; border: 0; background: none; border-radius: 12px; font-weight: 600; }
  .menu button:active { background: color-mix(in srgb, var(--ink) 6%, transparent); }

  main { padding-bottom: calc(200px + env(safe-area-inset-bottom)); }

  /* ---------- Kategorie-Karten ---------- */
  .group {
    --c: #888;
    margin-top: 14px; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden;
  }
  .group-head {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 10px;
    background: color-mix(in srgb, var(--c) var(--tint), var(--surface));
  }
  .badge {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 18px;
    background: color-mix(in srgb, var(--c) var(--tint-strong), var(--surface));
  }
  .group-head h2 { margin: 0; flex: 1; font-size: 15px; font-weight: 700; letter-spacing: -.01em; color: color-mix(in srgb, var(--c) 70%, var(--ink)); }
  .group-head .n {
    min-width: 26px; height: 24px; padding: 0 8px; border-radius: 99px; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: color-mix(in srgb, var(--c) 75%, var(--ink));
    background: color-mix(in srgb, var(--c) var(--tint-strong), var(--surface));
  }

  ul { list-style: none; margin: 0; padding: 0; }
  .item { --c: #888; position: relative; overflow: hidden; }
  .item + .item .inner::before {
    content: ""; position: absolute; top: 0; left: 54px; right: 0; height: 1px; background: var(--line);
  }
  .swipe-bg {
    position: absolute; inset: 0; background: color-mix(in srgb, var(--danger) 70%, var(--surface)); color: #fff;
    display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; font-weight: 700; font-size: 14px;
    opacity: 0; transition: background .15s;
  }
  .item.swiping .swipe-bg { opacity: 1; }
  .item.armed .swipe-bg { background: var(--danger); }
  .inner {
    position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px; min-height: 58px;
    background: var(--surface); user-select: none; -webkit-user-select: none; touch-action: pan-y;
  }
  .check {
    flex: none; width: 28px; height: 28px; border-radius: 50%; padding: 0;
    border: 2.2px solid color-mix(in srgb, var(--c) 55%, var(--line)); background: none;
    display: grid; place-items: center; transition: background .2s, border-color .2s, transform .2s;
  }
  .check svg { width: 15px; height: 15px; color: #fff; }
  .check path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .25s ease-out .05s; }
  .item.done .check, .item.ticking .check { background: var(--c); border-color: var(--c); }
  .item.done .check path, .item.ticking .check path { stroke-dashoffset: 0; }
  .item.ticking .check { animation: tick .32s cubic-bezier(.3, 1.6, .5, 1); }
  .item.ticking .name { color: var(--muted); }
  .text { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; transition: color .2s; }
  .qty {
    display: inline-block; margin-left: 7px; padding: 1px 8px; border-radius: 99px; font-size: 13px; font-weight: 700; vertical-align: 1px;
    color: color-mix(in srgb, var(--c) 80%, var(--ink)); background: color-mix(in srgb, var(--c) var(--tint), var(--surface));
  }
  .by { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; margin-top: 1px; }
  .del { flex: none; width: 36px; height: 36px; border: 0; background: none; color: var(--muted); font-size: 22px; border-radius: 12px; display: none; }
  @media (hover: hover) {
    .del { display: block; opacity: 0; transition: opacity .15s; }
    .item:hover .del { opacity: .7; }
    .del:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  }
  .item.enter .inner { animation: slideIn .35s cubic-bezier(.2, .8, .2, 1); }

  /* ---------- Im Wagen ---------- */
  .done-head { display: flex; justify-content: space-between; align-items: center; margin: 30px 2px 10px; }
  .done-head h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--muted); }
  .finish {
    border: 0; padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14px;
    color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .finish:active { transform: scale(.97); }
  .done-list { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-sm); overflow: hidden; opacity: .85; }
  .item.done .name { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--muted); font-weight: 500; }
  .item.done .qty { filter: grayscale(1); opacity: .7; }

  .empty { text-align: center; color: var(--muted); padding: 48px 20px 10px; font-weight: 500; }
  .empty .big {
    width: 88px; height: 88px; border-radius: 30px; margin: 0 auto 16px; display: grid; place-items: center; font-size: 42px;
    background: var(--surface); box-shadow: var(--shadow);
  }
  .empty strong { display: block; color: var(--ink); font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }

  /* ---------- Eingabe unten ---------- */
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 0 0 calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  .panel {
    pointer-events: auto; background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px);
    border-radius: 26px; box-shadow: var(--shadow-lg); padding: 12px 10px 10px;
    border: 1px solid color-mix(in srgb, var(--ink) 6%, transparent);
  }
  .chips-label { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 7px 6px; }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 0 2px 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    --c: #888; flex: none; border: 0; border-radius: 99px; padding: 8px 13px; font-size: 14px; font-weight: 600; white-space: nowrap;
    user-select: none; -webkit-user-select: none;
    color: color-mix(in srgb, var(--c) 75%, var(--ink)); background: color-mix(in srgb, var(--c) var(--tint), var(--surface));
    transition: transform .12s;
  }
  .chip:active { transform: scale(.95); }
  .chip.del-mode { background: var(--danger); color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; }
  .field {
    flex: 1; display: flex; align-items: center; background: var(--bg); border-radius: 18px; min-width: 0;
    border: 1.5px solid transparent; transition: border-color .15s;
  }
  .field:focus-within { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .cat {
    --c: #888; position: relative; flex: none; width: 40px; height: 40px; margin-left: 5px; border-radius: 13px;
    display: grid; place-items: center; font-size: 19px; transition: background .2s;
    background: color-mix(in srgb, var(--c) var(--tint-strong), var(--surface));
  }
  .cat select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  .field input { border: 0; background: none; outline: none; padding: 0 10px; height: 50px; min-width: 0; font-size: 17px; font-weight: 600; }
  .field input::placeholder { color: var(--muted); font-weight: 500; }
  #name { flex: 1; }
  #qty { width: 70px; flex: none; text-align: center; font-size: 15px; border-left: 1.5px solid var(--line); height: 28px; }
  .add {
    flex: none; width: 52px; height: 52px; border-radius: 18px; border: 0; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink);
    box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--accent) 80%, transparent);
    transition: transform .12s, opacity .2s, filter .2s;
  }
  .add svg { width: 22px; height: 22px; }
  .add:active { transform: scale(.94); }
  .add:disabled { opacity: .4; filter: grayscale(.6); box-shadow: none; }

  /* ---------- Login ---------- */
  .login { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; padding: 24px 16px; }
  .login::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(45% 35% at 20% 15%, color-mix(in srgb, #4cc27a 28%, transparent), transparent 70%),
      radial-gradient(40% 30% at 85% 30%, color-mix(in srgb, #f2a93b 24%, transparent), transparent 70%),
      radial-gradient(45% 35% at 50% 95%, color-mix(in srgb, #d0559a 16%, transparent), transparent 70%);
  }
  .login[hidden] { display: none; }
  .card { position: relative; width: 100%; max-width: 380px; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow-lg); padding: 30px 22px 22px; }
  .card .logo { width: 60px; height: 60px; border-radius: 18px; display: block; margin-bottom: 18px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
  .card p { margin: 0 0 22px; color: var(--muted); font-size: 15px; }
  .card label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 6px 4px; }
  .card input {
    width: 100%; height: 52px; border: 1.5px solid transparent; border-radius: 16px; background: var(--bg);
    padding: 0 16px; font-size: 17px; font-weight: 600; margin-bottom: 14px; outline: none;
  }
  .card input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .btn-main {
    width: 100%; height: 54px; border: 0; border-radius: 16px; font-weight: 700; font-size: 17px; margin-top: 4px;
    color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--accent) 80%, transparent);
  }
  .err { color: var(--danger); font-size: 14px; font-weight: 600; min-height: 20px; margin-top: 12px; text-align: center; }

  /* ---------- Tabs ---------- */
  .tabs-wrap { padding-bottom: 14px; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 15px; background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .tab {
    flex: 1; height: 38px; border: 0; background: none; border-radius: 11px; font-weight: 700; font-size: 15px; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 7px; transition: background .2s, color .2s;
  }
  .tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .tab-badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: #ff3d6e; color: #fff; font-size: 12px; display: inline-grid; place-items: center; }
  .tab-badge[hidden] { display: none; }
  body.mode-kochen #progress, body.mode-kochen #list, body.mode-kochen #done, body.mode-kochen .composer { display: none !important; }
  body:not(.mode-kochen) #cook { display: none; }
  body.mode-kochen main { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }

  /* ---------- Kochen ---------- */
  .deck-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--muted); margin: 4px 2px 10px; }
  .deck { position: relative; height: min(122vw, 540px); max-height: calc(100dvh - 330px); min-height: 340px; }
  .rcard {
    position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border-radius: 26px; box-shadow: var(--shadow-lg);
    touch-action: none; user-select: none; -webkit-user-select: none; will-change: transform;
  }
  .rcard.behind { transform: scale(.94) translateY(16px); opacity: .6; pointer-events: none; }
  .rcard .rimg { flex: 1; min-height: 0; background: color-mix(in srgb, var(--ink) 6%, var(--surface)) center / cover no-repeat; }
  .rinfo { padding: 14px 18px 18px; }
  .rinfo h3 { margin: 0 0 9px; font-size: 21px; line-height: 1.2; font-weight: 800; letter-spacing: -.02em; }
  .rmeta { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 99px; color: var(--muted); background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .pill.neu { color: color-mix(in srgb, #d0559a 80%, var(--ink)); background: color-mix(in srgb, #d0559a var(--tint-strong), var(--surface)); }
  .pill.sammlung { color: color-mix(in srgb, #3f9d4b 80%, var(--ink)); background: color-mix(in srgb, #3f9d4b var(--tint-strong), var(--surface)); }
  .stamp {
    position: absolute; top: 24px; padding: 4px 14px; border: 4px solid; border-radius: 12px; opacity: 0;
    font-size: 28px; font-weight: 800; letter-spacing: .05em; background: color-mix(in srgb, var(--surface) 75%, transparent);
  }
  .stamp.yes { left: 20px; color: #22a35a; border-color: #22a35a; transform: rotate(-14deg); }
  .stamp.no { right: 20px; color: var(--danger); border-color: var(--danger); transform: rotate(14deg); }
  .deck-actions { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 18px 0 4px; }
  .round {
    width: 66px; height: 66px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--shadow); font-size: 28px; line-height: 1; transition: transform .12s;
  }
  .round:active { transform: scale(.9); }
  a.round { color: var(--muted); text-decoration: none; }
  .round.no { color: var(--danger); }
  .round.yes { color: #fff; background: linear-gradient(135deg, #ff7a93, #ff3d6e); box-shadow: 0 10px 22px -10px #ff3d6e; }
  .round.small { width: 46px; height: 46px; font-size: 19px; color: var(--muted); }
  .round.small:disabled { opacity: .35; }

  .section-title { margin: 30px 2px 10px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .section-sub { margin: -6px 2px 12px; color: var(--muted); font-size: 14px; }
  .mlist { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
  .mrow { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 10px; }
  .mrow + .mrow { border-top: 1px solid var(--line); }
  .mthumb { flex: none; width: 62px; height: 62px; border-radius: 15px; background: color-mix(in srgb, var(--ink) 6%, var(--surface)) center / cover no-repeat; }
  .mt { flex: 1; min-width: 0; }
  .mt a { color: inherit; text-decoration: none; font-weight: 700; font-size: 15.5px; line-height: 1.25; display: block; }
  .mt span { display: block; color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .mbtn { flex: none; border: 0; border-radius: 12px; padding: 9px 11px; font-size: 13px; font-weight: 700; background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .mbtn.go { color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .mbtn.x { padding: 9px 12px; color: var(--muted); }

  .cook-empty { text-align: center; padding: 40px 20px 8px; color: var(--muted); }
  .cook-empty .big { width: 88px; height: 88px; border-radius: 30px; margin: 0 auto 16px; display: grid; place-items: center; font-size: 42px; background: var(--surface); box-shadow: var(--shadow); }
  .cook-empty strong { display: block; color: var(--ink); font-size: 20px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }

  .scard { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 16px; }
  .scard + .scard { margin-top: 12px; }
  .scard h4 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
  .scard p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .pantry { display: flex; flex-wrap: wrap; gap: 7px; }
  .pantry .chip { --c: #8a8a80; }
  .pantry-add { display: flex; gap: 8px; margin-top: 12px; }
  .pantry-add input { flex: 1; min-width: 0; height: 44px; border: 1.5px solid transparent; border-radius: 14px; background: var(--bg); padding: 0 14px; font-size: 16px; font-weight: 600; outline: none; }
  .pantry-add input:focus { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .btn-line { border: 0; border-radius: 14px; padding: 0 16px; height: 44px; font-weight: 700; background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .btn-line.go { color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .ok-line { color: var(--accent); font-weight: 700; font-size: 15px; }

  .match-overlay {
    position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; padding: 24px 16px;
    background: color-mix(in srgb, var(--bg) 60%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: pop .25s ease-out;
  }
  .match-card { width: 100%; max-width: 360px; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow-lg); overflow: hidden; text-align: center; }
  .match-card .mimg { height: 210px; background: color-mix(in srgb, var(--ink) 6%, var(--surface)) center / cover no-repeat; }
  .match-card .mc { padding: 18px 20px 20px; }
  .match-kicker { display: inline-block; padding: 5px 12px; border-radius: 99px; font-weight: 800; font-size: 13px; color: #fff; background: linear-gradient(135deg, #ff7a93, #ff3d6e); margin-bottom: 10px; }
  .match-card h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  .match-card p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  .match-card .link { display: block; margin-top: 12px; color: var(--muted); font-size: 14px; font-weight: 600; }

  /* ---------- Toast & Konfetti ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(165px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(16px);
    background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 16px; font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 12px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: all .25s cubic-bezier(.2, .8, .2, 1); z-index: 30; box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast:not(:has(button)) { padding-right: 16px; }
  .toast button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); font-weight: 700; padding: 7px 12px; border-radius: 11px; }
  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  @keyframes tick { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes slideIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap head">
    <div>
      <div class="date"><span class="dot" id="dot"></span><span id="date"></span></div>
      <h1>Einkauf</h1>
    </div>
    <button class="icon-btn" id="menuBtn" aria-label="Menü">⋯</button>
  </div>
  <div class="wrap tabs-wrap">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="liste" role="tab">🛒 Liste</button>
      <button class="tab" data-tab="kochen" role="tab">🍳 Kochen <span class="tab-badge" id="cookBadge" hidden></span></button>
    </div>
  </div>
  <div class="wrap progress" id="progress" hidden>
    <div class="progress-top"><span id="count"></span><span id="ratio"></span></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>
  <div class="menu" id="menu">
    <div class="who" id="who"></div>
    <button id="reloadBtn">Neu laden</button>
    <button id="logoutBtn">Abmelden</button>
  </div>
</header>

<main class="wrap">
  <div id="list"></div>
  <div id="done"></div>
  <div id="cook"></div>
</main>

<form class="composer" id="addForm" autocomplete="off">
  <div class="wrap">
    <div class="panel">
      <div class="chips-label" id="chipsLabel"></div>
      <div class="chips" id="chips"></div>
      <div class="row">
        <div class="field">
          <div class="cat" id="catBox"><span id="catIcon">📦</span><select id="cat" aria-label="Kategorie"></select></div>
          <input id="name" placeholder="Was fehlt?" enterkeyhint="done" maxlength="80">
          <input id="qty" placeholder="Menge" maxlength="20">
        </div>
        <button class="add" id="addBtn" type="submit" aria-label="Hinzufügen" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </div>
</form>

<div class="login" id="login" hidden>
  <form class="card" id="loginForm" autocomplete="on">
    <img class="logo" src="icon.svg?v=2" alt="">
    <h2>Unsere Einkaufsliste</h2>
    <p>Einmal anmelden, danach bleibt dieses Handy angemeldet.</p>
    <label for="loginName">Dein Name</label>
    <input id="loginName" name="name" placeholder="z. B. Brian" maxlength="30" required>
    <label for="loginPin">PIN</label>
    <input id="loginPin" name="password" type="password" placeholder="mind. 4 Zeichen" required autocomplete="current-password">
    <button class="btn-main" type="submit">Los geht's</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
  // --- Konfiguration (Supabase → Project Settings → API) ---
  const SUPABASE_URL = 'https://xzaanhidtjvicsbtbsvk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_GBMxJjEZKvwsXL1T_ANSQQ_GLdFKxQs';

  // Reihenfolge = Weg durch den Discounter
  const CATS = [
    { id: 'Obst & Gemüse', icon: '🥦', color: '#3f9d4b', kw: ['apfel', 'äpfel', 'banane', 'birne', 'tomate', 'gurke', 'salat', 'paprika', 'zwiebel', 'kartoffel', 'möhre', 'karotte', 'zitrone', 'limette', 'orange', 'mandarine', 'beere', 'traube', 'avocado', 'knoblauch', 'pilz', 'champignon', 'zucchini', 'brokkoli', 'spinat', 'kräuter', 'petersilie', 'basilikum', 'ingwer', 'lauch', 'kohl', 'obst', 'gemüse', 'mango', 'kiwi', 'melone', 'aubergine', 'radieschen', 'rucola', 'sellerie', 'pflaume', 'pfirsich', 'nektarine', 'ananas'] },
    { id: 'Brot & Backwaren', icon: '🥖', color: '#d08a26', kw: ['brot', 'brötchen', 'toast', 'baguette', 'croissant', 'brezel', 'laugen', 'kuchen', 'wrap', 'tortilla', 'semmel', 'knäcke'] },
    { id: 'Kühlregal', icon: '🧀', color: '#3b88c9', kw: ['milch', 'joghurt', 'jogurt', 'quark', 'käse', 'butter', 'sahne', 'eier', 'schmand', 'frischkäse', 'mozzarella', 'feta', 'skyr', 'margarine', 'pudding', 'hefe', 'tofu', 'hummus', 'gnocchi', 'aufback', 'kefir', 'buttermilch', 'creme fraiche', 'crème fraîche', 'parmesan', 'gouda', 'emmentaler', 'ricotta', 'mascarpone', 'burrata', 'halloumi', 'cheddar', 'bergkäse', 'blätterteig', 'pizzateig'] },
    { id: 'Fleisch & Fisch', icon: '🥩', color: '#d4564a', kw: ['fleisch', 'hack', 'hähnchen', 'huhn', 'pute', 'wurst', 'schinken', 'salami', 'steak', 'schnitzel', 'lachs', 'fisch', 'speck', 'würstchen', 'bacon', 'garnelen', 'thunfisch', 'aufschnitt', 'gyros', 'bratwurst'] },
    { id: 'Vorrat', icon: '🥫', color: '#e07a2e', kw: ['nudeln', 'pasta', 'spaghetti', 'penne', 'reis', 'mehl', 'zucker', 'salz', 'öl', 'olivenöl', 'essig', 'konserve', 'dose', 'tomatenmark', 'passierte', 'dosentomaten', 'linsen', 'bohnen', 'mais', 'soße', 'sauce', 'ketchup', 'senf', 'mayo', 'brühe', 'gewürz', 'pfeffer', 'paprikapulver', 'pesto', 'backpulver', 'kokosmilch', 'kichererbsen', 'couscous', 'bulgur'] },
    { id: 'Frühstück & Süßes', icon: '🍫', color: '#d0559a', kw: ['müsli', 'cornflakes', 'haferflocken', 'marmelade', 'konfitüre', 'honig', 'nutella', 'schokolade', 'schoko', 'kekse', 'chips', 'gummibär', 'süßigkeit', 'riegel', 'kaffee', 'tee', 'kakao', 'nüsse', 'aufstrich', 'erdnuss', 'cracker', 'salzstangen', 'popcorn', 'bonbons'] },
    { id: 'Getränke', icon: '🥤', color: '#1fa395', kw: ['wasser', 'saft', 'bier', 'wein', 'cola', 'limo', 'sprudel', 'eistee', 'sekt', 'mate', 'smoothie', 'schorle', 'radler', 'energy', 'sirup', 'hafermilch', 'sojamilch', 'mandelmilch'] },
    { id: 'Tiefkühl', icon: '🧊', color: '#5a73d6', kw: ['tk', 'tiefkühl', 'pizza', 'eis', 'pommes', 'fischstäbchen', 'kroketten', 'rahmspinat', 'eiswürfel'] },
    { id: 'Drogerie & Haushalt', icon: '🧴', color: '#8a63d2', kw: ['klopapier', 'toilettenpapier', 'küchenrolle', 'küchenpapier', 'spüli', 'spülmittel', 'waschmittel', 'weichspüler', 'shampoo', 'duschgel', 'zahnpasta', 'zahnbürste', 'zahnseide', 'deo', 'seife', 'müllbeutel', 'müllsäcke', 'taschentücher', 'feuchttücher', 'windeln', 'schwamm', 'alufolie', 'frischhaltefolie', 'backpapier', 'batterien', 'creme', 'rasier', 'tabs', 'reiniger', 'tampons', 'binden', 'wattepads', 'gefrierbeutel', 'kerzen'] },
    { id: 'Sonstiges', icon: '📦', color: '#8a8a80', kw: [] },
  ];
  const catOf = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];
  const catIndex = id => { const i = CATS.findIndex(c => c.id === id); return i < 0 ? CATS.length - 1 : i; };

  // Längster passender Begriff gewinnt ("Tomatenmark" → Vorrat, nicht Obst & Gemüse)
  function guessCategory(name) {
    const s = name.toLowerCase().trim();
    if (!s) return null;
    const fav = state.favorites.find(f => f.name.toLowerCase() === s);
    if (fav) return fav.category;
    const tokens = s.split(/[\s,.\-\/+]+/);
    let best = null, bestLen = 0;
    for (const c of CATS) for (const k of c.kw) {
      const hit = k.length <= 3 ? tokens.includes(k) : s.includes(k);
      if (hit && k.length > bestLen) { best = c.id; bestLen = k.length; }
    }
    return best;
  }

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let pin = store.get('ek_pin');
  let me = store.get('ek_name') || '';
  let state = { items: [], favorites: [] };
  let catTouched = false;
  const justAdded = new Set();

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

  // --- Sync zwischen den Handys ---
  const channel = sb.channel('einkaufsliste', { config: { broadcast: { self: false } } });
  channel.on('broadcast', { event: 'changed' }, () => { load(); loadCook(); }).subscribe();
  const ping = () => channel.send({ type: 'broadcast', event: 'changed', payload: {} }).catch(() => {});

  async function rpc(fn, args = {}) {
    const { data, error } = await sb.rpc(fn, { p_pin: pin, ...args });
    if (error) {
      if (/invalid pin/.test(error.message)) logout('Die PIN stimmt nicht mehr. Bitte neu anmelden.');
      throw error;
    }
    return data;
  }

  let loading = false, loadAgain = false, busy = 0;
  async function load() {
    if (!pin) return;
    if (loading) { loadAgain = true; return; }
    loading = true;
    try {
      const fresh = await rpc('get_state');
      setOnline(true);
      // während einer Animation nicht dazwischenfunken
      if (!busy) { state = fresh; render(); }
    } catch (e) {
      setOnline(false);
    } finally {
      loading = false;
      if (loadAgain) { loadAgain = false; load(); }
    }
  }

  async function mutate(fn, args, optimistic) {
    if (optimistic) { optimistic(); render(); }
    try {
      await rpc(fn, args);
      ping();
    } catch (e) {
      toast('Hat nicht geklappt – bitte nochmal versuchen.');
    }
    load();
  }

  function setOnline(ok) {
    $('dot').classList.toggle('off', !ok);
    $('dot').title = ok ? 'verbunden' : 'keine Verbindung';
  }

  let toastTimer;
  function toast(msg, actionLabel, action) {
    const t = $('toast');
    t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ''}`;
    if (actionLabel) t.querySelector('button').onclick = () => { t.classList.remove('show'); action(); };
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 4500 : 2600);
  }

  // --- Darstellung ---
  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function itemHtml(it) {
    const c = catOf(it.category);
    const by = it.source_recipe ? `<span class="by">für ${esc(it.source_recipe)}</span>`
      : it.added_by && it.added_by !== me ? `<span class="by">von ${esc(it.added_by)}</span>` : '';
    const enter = justAdded.has(it.name.toLowerCase()) && !it.checked ? ' enter' : '';
    return `<li class="item${it.checked ? ' done' : ''}${enter}" data-id="${esc(it.id)}" style="--c:${c.color}">
      <div class="swipe-bg">Löschen</div>
      <div class="inner">
        <button class="check" aria-label="${it.checked ? 'Wieder offen' : 'Abhaken'}">${checkSvg}</button>
        <div class="text"><span class="name">${esc(it.name)}</span>${it.qty ? `<span class="qty">${esc(it.qty)}</span>` : ''}${by}</div>
        <button class="del" aria-label="Löschen">×</button>
      </div>
    </li>`;
  }

  function render() {
    const open = state.items.filter(i => !i.checked);
    const done = state.items.filter(i => i.checked)
      .sort((a, b) => String(b.checked_at).localeCompare(String(a.checked_at)));
    const total = state.items.length;

    $('progress').hidden = total === 0;
    $('count').innerHTML = open.length === 0 ? '<b>Alles im Wagen</b>'
      : `<b>${open.length}</b> ${open.length === 1 ? 'Artikel' : 'Artikel'} offen`;
    $('ratio').textContent = `${done.length} von ${total} im Wagen`;
    $('barFill').style.width = total ? `${Math.round(done.length / total * 100)}%` : '0';

    if (open.length === 0) {
      $('list').innerHTML = `<div class="empty"><div class="big">${done.length ? '🎉' : '🛒'}</div>
        <strong>${done.length ? 'Alles im Wagen!' : 'Die Liste ist leer'}</strong>
        ${done.length ? 'Nach dem Einkauf auf „Woche fertig“ tippen.' : 'Unten eintippen oder einen häufigen Artikel antippen.'}</div>`;
    } else {
      const groups = new Map();
      open.sort((a, b) => catIndex(a.category) - catIndex(b.category) || String(a.created_at).localeCompare(String(b.created_at)))
        .forEach(i => {
          const c = catOf(i.category).id;
          if (!groups.has(c)) groups.set(c, []);
          groups.get(c).push(i);
        });
      $('list').innerHTML = [...groups].map(([id, items]) => {
        const c = catOf(id);
        return `<section class="group" style="--c:${c.color}">
          <div class="group-head"><span class="badge">${c.icon}</span><h2>${esc(c.id)}</h2><span class="n">${items.length}</span></div>
          <ul>${items.map(itemHtml).join('')}</ul></section>`;
      }).join('');
    }

    $('done').innerHTML = done.length ? `<div class="done-head"><h2>✓ Im Wagen · ${done.length}</h2>
      <button class="finish" id="clearBtn">🎉 Woche fertig</button></div>
      <ul class="done-list">${done.map(itemHtml).join('')}</ul>` : '';

    justAdded.clear();
    renderChips();
  }

  let delModeName = null;
  function renderChips() {
    const q = $('name').value.trim().toLowerCase();
    const onList = new Set(state.items.filter(i => !i.checked).map(i => i.name.toLowerCase()));
    let favs = state.favorites.filter(f => !onList.has(f.name.toLowerCase()));
    if (q) favs = favs.filter(f => f.name.toLowerCase().includes(q) && f.name.toLowerCase() !== q)
      .sort((a, b) => b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q));
    favs = favs.slice(0, q ? 8 : 14);
    $('chipsLabel').textContent = favs.length ? (q ? 'Vorschläge' : 'Oft gekauft · gedrückt halten zum Entfernen') : '';
    $('chips').innerHTML = favs.map(f => {
      const c = catOf(f.category);
      return `<button type="button" class="chip${delModeName === f.name ? ' del-mode' : ''}" data-name="${esc(f.name)}" style="--c:${c.color}">${delModeName === f.name ? '× entfernen' : c.icon + ' ' + esc(f.name)}</button>`;
    }).join('');
    $('chips').style.display = favs.length ? '' : 'none';
    $('chipsLabel').style.display = favs.length ? '' : 'none';
  }

  function setCat(id) {
    const c = catOf(id);
    $('cat').value = c.id;
    $('catIcon').textContent = c.icon;
    $('catBox').style.setProperty('--c', c.color);
  }

  // Zeile zuklappen, danach weiter
  function collapse(row, then) {
    if (reducedMotion) { then(); return; }
    busy++;
    const h = row.offsetHeight;
    const a = row.animate(
      [{ height: h + 'px', opacity: 1 }, { height: '0px', opacity: 0 }],
      { duration: 240, easing: 'cubic-bezier(.4, 0, .2, 1)', fill: 'forwards' }
    );
    a.onfinish = () => { busy--; then(); };
  }

  // --- Aktionen ---
  function addItem(name, qty, category) {
    name = cap(name.trim());
    qty = (qty || '').trim();
    if (!name) return;
    category = category || guessCategory(name) || 'Sonstiges';
    justAdded.add(name.toLowerCase());
    mutate('add_item', { p_name: name, p_qty: qty, p_category: category, p_by: me }, () => {
      const ex = state.items.find(i => !i.checked && i.name.toLowerCase() === name.toLowerCase());
      if (ex) { if (qty) ex.qty = qty; ex.category = category; }
      else state.items.push({ id: 'tmp-' + Date.now(), name, qty, category, checked: false, added_by: me, created_at: new Date().toISOString() });
    });
  }

  function toggleItem(row, id) {
    const it = state.items.find(i => i.id === id);
    if (!it) return;
    navigator.vibrate?.(10);
    const apply = () => mutate('toggle_item', { p_id: id }, () => {
      it.checked = !it.checked;
      it.checked_at = new Date().toISOString();
    });
    if (it.checked || reducedMotion) { apply(); return; }
    // Haken zeigen, kurz stehen lassen, dann wegklappen
    row.classList.add('ticking');
    busy++;
    setTimeout(() => { busy--; collapse(row, apply); }, 320);
  }

  function deleteItem(id) {
    const it = state.items.find(i => i.id === id);
    if (!it) return;
    mutate('delete_item', { p_id: id }, () => { state.items = state.items.filter(i => i.id !== id); });
    toast(`„${it.name}“ gelöscht`, 'Rückgängig', () => {
      addItem(it.name, it.qty, it.category);
    });
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    addItem($('name').value, $('qty').value, catTouched ? $('cat').value : null);
    $('name').value = '';
    $('qty').value = '';
    catTouched = false;
    setCat('Sonstiges');
    $('addBtn').disabled = true;
    renderChips();
    $('name').focus();
  });

  $('name').addEventListener('input', () => {
    const v = $('name').value;
    $('addBtn').disabled = !v.trim();
    if (!catTouched) setCat(guessCategory(v) || 'Sonstiges');
    delModeName = null;
    renderChips();
  });
  $('cat').addEventListener('change', () => { catTouched = true; setCat($('cat').value); });

  // Chips: tippen = hinzufügen, gedrückt halten = Entfernen anbieten
  let pressTimer = null, pressed = false;
  $('chips').addEventListener('pointerdown', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    pressed = false;
    pressTimer = setTimeout(() => { pressed = true; delModeName = chip.dataset.name; renderChips(); navigator.vibrate?.(15); }, 550);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => $('chips').addEventListener(t, () => clearTimeout(pressTimer)));
  $('chips').addEventListener('contextmenu', e => e.preventDefault());
  $('chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    if (pressed) { pressed = false; return; }
    const name = chip.dataset.name;
    if (delModeName === name) {
      delModeName = null;
      mutate('delete_favorite', { p_name: name }, () => { state.favorites = state.favorites.filter(f => f.name !== name); });
      return;
    }
    delModeName = null;
    const fav = state.favorites.find(f => f.name === name);
    addItem(name, $('qty').value, fav?.category);
    $('name').value = ''; $('qty').value = ''; $('addBtn').disabled = true;
    catTouched = false; setCat('Sonstiges');
  });

  // Nach links wischen = löschen
  let sw = null, suppressClick = false;
  document.addEventListener('pointerdown', e => {
    const inner = e.target.closest('.item .inner');
    if (!inner || e.button > 0 || inner.parentElement.dataset.id.startsWith('tmp-')) return;
    sw = { inner, row: inner.parentElement, x0: e.clientX, y0: e.clientY, dx: 0, active: false };
  });
  document.addEventListener('pointermove', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.active) {
      if (dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        sw.active = true;
        busy++;
        sw.row.classList.add('swiping');
        try { sw.inner.setPointerCapture(e.pointerId); } catch {}
      } else if (Math.abs(dy) > 10 || dx > 10) { sw = null; return; }
      else return;
    }
    sw.dx = Math.min(0, dx);
    sw.inner.style.transform = `translateX(${sw.dx}px)`;
    const armed = sw.dx < -90;
    if (armed !== sw.row.classList.contains('armed')) { sw.row.classList.toggle('armed', armed); if (armed) navigator.vibrate?.(8); }
  });
  function endSwipe() {
    if (!sw) return;
    const s = sw; sw = null;
    if (!s.active) return;
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);
    busy--;
    if (s.dx < -90) {
      s.inner.style.transition = 'transform .18s ease-in';
      s.inner.style.transform = 'translateX(-105%)';
      setTimeout(() => collapse(s.row, () => deleteItem(s.row.dataset.id)), 170);
    } else {
      s.inner.style.transition = 'transform .28s cubic-bezier(.2, .9, .3, 1.2)';
      s.inner.style.transform = '';
      setTimeout(() => { s.row.classList.remove('swiping', 'armed'); s.inner.style.transition = ''; }, 290);
    }
  }
  document.addEventListener('pointerup', endSwipe);
  document.addEventListener('pointercancel', endSwipe);

  document.addEventListener('click', e => {
    if (suppressClick) return;
    const tabBtn = e.target.closest('.tab');
    if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
    const act = e.target.closest('[data-act]');
    if (act && act.tagName !== 'FORM' && act.closest('#cook')) {
      cookAction(act.dataset.act, act).catch(() => toast('Hat nicht geklappt – bitte nochmal versuchen.'));
      return;
    }
    const row = e.target.closest('.item');
    if (row) {
      const id = row.dataset.id;
      if (id.startsWith('tmp-') || row.classList.contains('ticking')) return;
      if (e.target.closest('.del')) collapse(row, () => deleteItem(id));
      else toggleItem(row, id);
      return;
    }
    if (e.target.id === 'clearBtn') {
      const n = state.items.filter(i => i.checked).length;
      confetti();
      mutate('clear_checked', {}, () => { state.items = state.items.filter(i => !i.checked); });
      toast(n === 1 ? 'Geschafft! 1 Artikel weggeräumt' : `Geschafft! ${n} Artikel weggeräumt`);
      return;
    }
    if (e.target.id === 'menuBtn') { $('menu').classList.toggle('open'); return; }
    if (!e.target.closest('.menu')) $('menu').classList.remove('open');
    if (delModeName && !e.target.closest('.chip')) { delModeName = null; renderChips(); }
  });

  $('reloadBtn').addEventListener('click', () => { $('menu').classList.remove('open'); load(); });
  $('logoutBtn').addEventListener('click', () => { $('menu').classList.remove('open'); logout(); });

  function confetti() {
    if (reducedMotion) return;
    const cv = document.createElement('canvas');
    cv.className = 'confetti';
    document.body.append(cv);
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const colors = CATS.slice(0, -1).map(c => c.color);
    const parts = Array.from({ length: 150 }, (_, i) => {
      const side = i % 2 ? 1 : -1;
      return {
        x: side > 0 ? W * .1 : W * .9, y: H * .7,
        vx: side * (Math.random() * 9 + 3), vy: -(Math.random() * 15 + 9),
        w: Math.random() * 7 + 5, h: Math.random() * 4 + 3,
        c: colors[Math.random() * colors.length | 0], rot: Math.random() * 6, vr: (Math.random() - .5) * .35,
      };
    });
    const t0 = performance.now(), dur = 2200;
    (function frame(t) {
      const el = t - t0;
      ctx.clearRect(0, 0, W, H);
      for (const p of parts) {
        p.vy += .42; p.vx *= .985; p.vy *= .99;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el - dur * .6) / (dur * .4));
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (el < dur) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  // --- Kochen: Rezept-Vorschläge aus Cookidoo ---
  const VAPID_PUBLIC = 'BDKR9kdRMhrtplhm700Zvft5Tz1dgMBJYXdHA180i4DpEyRAWL7-fWdpXzpYzwEFbyAfonVxAW3EzS4dwaP1NAw';
  let tab = 'liste';
  let cook = null;
  let cookBusy = false;
  const undoStack = [];
  let undoneId = null;

  function setTab(t) {
    tab = t;
    document.body.classList.toggle('mode-kochen', t === 'kochen');
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    history.replaceState(null, '', t === 'kochen' ? '#kochen' : location.pathname + location.search);
    window.scrollTo(0, 0);
    if (t === 'kochen') { renderCook(); loadCook(); }
  }

  const seen = {
    get() { try { return JSON.parse(store.get('ek_seen') || 'null'); } catch { return null; } },
    add(id) { const s = this.get() || []; if (!s.includes(id)) { s.push(id); store.set('ek_seen', JSON.stringify(s.slice(-60))); } },
  };

  async function loadCook() {
    if (!pin || cookBusy) return;
    try {
      const fresh = await rpc('get_cooking', { p_person: me });
      if (cookBusy) return;
      const known = seen.get();
      const matched = fresh.recipes.filter(r => r.matched);
      if (known === null) store.set('ek_seen', JSON.stringify(matched.map(r => r.id)));
      else matched.filter(r => !known.includes(r.id)).forEach(r => { seen.add(r.id); toast(`Neuer Treffer: ${r.name} 💚`); });
      cook = fresh;
      updateBadge();
      if (tab === 'kochen') renderCook();
    } catch {}
  }

  const svg = (d, w = 2.6, fill = 'none') => `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="${fill}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICONS = {
    no: svg('<path d="M6 6l12 12M18 6L6 18"/>', 3),
    yes: svg('<path d="M12 20.5s-7.5-4.6-9.2-9.3C1.6 7.8 3.7 4.5 7.1 4.5c2.1 0 3.6 1.2 4.9 3 1.3-1.8 2.8-3 4.9-3 3.4 0 5.5 3.3 4.3 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/>', 0, 'currentColor'),
    undo: svg('<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>'),
    open: svg('<path d="M7 17L17 7M8 7h9v9"/>'),
  };

  const deckOf = () => !cook ? [] : cook.recipes
    .filter(r => r.my_vote === null && !r.matched)
    .sort((a, b) => (b.id === undoneId) - (a.id === undoneId));

  function updateBadge() {
    const n = deckOf().length;
    $('cookBadge').hidden = n === 0;
    $('cookBadge').textContent = n;
  }

  function minutes(s) {
    if (!s) return '';
    const m = Math.round(s / 60);
    return m < 60 ? `${m} Min` : `${Math.floor(m / 60)} Std${m % 60 ? ` ${m % 60} Min` : ''}`;
  }
  const bg = url => url ? `style="background-image:url('${esc(url)}')"` : '';

  function renderCook() {
    const el = $('cook');
    if (!cook) { el.innerHTML = `<div class="cook-empty"><div class="big">🍳</div><strong>Lädt …</strong></div>`; return; }
    let html = '';
    if (!cook.week || !cook.recipes.length) {
      html += `<div class="cook-empty"><div class="big">🍳</div><strong>Noch keine Vorschläge</strong>
        Jeden Samstagabend kommen neue Rezepte aus eurem Cookidoo.</div>`;
    } else {
      const deck = deckOf();
      const total = cook.recipes.length;
      if (deck.length) {
        const [top, next] = deck;
        html += `<div class="deck-meta"><span>Woche ab ${new Date(cook.week).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' })}</span><span>${total - deck.length + 1} von ${total}</span></div>
          <div class="deck">
            ${next ? recipeCard(next, 'behind') : ''}
            ${recipeCard(top, 'top')}
          </div>
          <div class="deck-actions">
            <button class="round small" data-act="undo" aria-label="Zurück" ${undoStack.length ? '' : 'disabled'}>${ICONS.undo}</button>
            <button class="round no" data-act="no" aria-label="Nein">${ICONS.no}</button>
            <button class="round yes" data-act="yes" aria-label="Ja">${ICONS.yes}</button>
            <a class="round small" href="${esc(top.url)}" target="_blank" rel="noopener" aria-label="Rezept ansehen">${ICONS.open}</a>
          </div>`;
      } else {
        html += `<div class="cook-empty"><div class="big">👏</div><strong>Alles durchgewischt</strong>
          Sobald ihr beide gewischt habt, stehen eure Treffer hier.</div>`;
      }

      const matches = cook.recipes.filter(r => r.matched);
      if (matches.length) {
        html += `<div class="section-title">💚 Diese Woche kochen wir</div><div class="mlist">${matches.map(r => `
          <div class="mrow">
            <div class="mthumb" ${bg(r.image)}></div>
            <div class="mt"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a><span>${minutes(r.total_time)}${r.total_time ? ' · ' : ''}${r.ingredients.length} Zutaten</span></div>
            <button class="mbtn" data-act="readd" data-id="${esc(r.id)}" aria-label="Zutaten nochmal auf die Liste">🛒</button>
            <button class="mbtn x" data-act="unmatch" data-id="${esc(r.id)}" aria-label="Entfernen">✕</button>
          </div>`).join('')}</div>`;
      }

      const mine = cook.recipes.filter(r => r.my_vote === true && !r.matched);
      if (mine.length) {
        html += `<div class="section-title">♥ Nur du hast Lust</div>
          <div class="section-sub">Wartet noch auf die zweite Stimme.</div>
          <div class="mlist">${mine.map(r => `
          <div class="mrow">
            <div class="mthumb" ${bg(r.image)}></div>
            <div class="mt"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a><span>${minutes(r.total_time)}</span></div>
            <button class="mbtn go" data-act="force" data-id="${esc(r.id)}">Trotzdem kochen</button>
          </div>`).join('')}</div>`;
      }
    }

    html += `<div class="section-title">⚙️ Einstellungen</div>
      <div class="scard">
        <h4>Immer im Haus</h4>
        <p>Diese Zutaten kommen nicht auf die Einkaufsliste.</p>
        <div class="pantry">${(cook.pantry || []).map(p => `<button class="chip" data-act="pantry-del" data-name="${esc(p)}">${esc(p)} ×</button>`).join('')}</div>
        <form class="pantry-add" data-act="pantry-add"><input id="pantryInput" placeholder="z. B. Knoblauch" maxlength="40"><button class="btn-line">Dazu</button></form>
      </div>
      <div class="scard">
        <h4>Sonntags-Erinnerung</h4>
        <p>Eine Mitteilung, wenn neue Rezepte da sind.</p>
        <div id="pushState"></div>
      </div>`;
    el.innerHTML = html;
    renderPushState();
    const topCard = el.querySelector('.rcard.top');
    if (topCard) bindCard(topCard, deckOf()[0]);
  }

  function recipeCard(r, cls) {
    const src = r.source === 'sammlung' ? '<span class="pill sammlung">Aus euren Sammlungen</span>' : '<span class="pill neu">Neu entdecken</span>';
    return `<div class="rcard ${cls}" data-id="${esc(r.id)}">
      <div class="rimg" ${bg(r.image)}></div>
      <div class="stamp yes">LECKER</div><div class="stamp no">NÖ</div>
      <div class="rinfo"><h3>${esc(r.name)}</h3>
        <div class="rmeta">${src}${r.total_time ? `<span class="pill">⏱ ${minutes(r.total_time)}</span>` : ''}<span class="pill">${r.ingredients.length} Zutaten</span></div>
      </div>
    </div>`;
  }

  function bindCard(card, r) {
    let x0 = 0, y0 = 0, dx = 0, dy = 0, dragging = false;
    const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
    card.addEventListener('pointerdown', e => {
      if (e.button > 0 || cookBusy) return;
      dragging = true; x0 = e.clientX; y0 = e.clientY; dx = dy = 0;
      card.setPointerCapture(e.pointerId);
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', e => {
      if (!dragging) return;
      dx = e.clientX - x0; dy = e.clientY - y0;
      card.style.transform = `translate(${dx}px, ${dy * .3}px) rotate(${dx / 18}deg)`;
      yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
      no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      if (Math.abs(dx) > 100) { swipe(r, dx > 0, card); return; }
      card.style.transition = 'transform .3s cubic-bezier(.2, .9, .3, 1.2)';
      card.style.transform = '';
      yes.style.opacity = no.style.opacity = 0;
    };
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
  }

  function swipe(r, liked, card) {
    card = card || $('cook').querySelector('.rcard.top');
    if (!card || !r || cookBusy) return;
    cookBusy = true;
    navigator.vibrate?.(liked ? [8, 40, 8] : 8);
    card.querySelector(liked ? '.stamp.yes' : '.stamp.no').style.opacity = 1;
    card.style.transition = 'transform .32s ease-in, opacity .32s ease-in';
    card.style.transform = `translate(${(liked ? 1 : -1) * Math.round(innerWidth * 1.3)}px, 40px) rotate(${liked ? 24 : -24}deg)`;
    card.style.opacity = '0';
    setTimeout(async () => {
      r.my_vote = liked;
      undoStack.push(r.id);
      if (undoneId === r.id) undoneId = null;
      cookBusy = false;
      renderCook();
      updateBadge();
      try {
        const res = await rpc('vote', { p_person: me, p_recipe: r.id, p_liked: liked });
        ping();
        if (res && res.new_match) await onMatch(r, 'Ihr habt beide Lust drauf.');
      } catch {
        r.my_vote = null;
        renderCook();
        toast('Stimme nicht gespeichert – bitte nochmal.');
      }
    }, 300);
  }

  function ingredientItems(r) {
    const pantry = (cook.pantry || []).map(p => p.toLowerCase());
    return (r.ingredients || [])
      .filter(i => {
        // "Öl" deckt Olivenöl/Rapsöl ab, "Pfeffer" auch "Pfeffer, schwarz" – aber "Salz" nicht "Salzstangen"
        const n = i.name.toLowerCase().trim();
        const words = n.split(/[\s,]+/);
        return !pantry.some(p => words.includes(p) || n.endsWith(p));
      })
      .map(i => {
        let q = (i.description || '').trim();
        if (q.length > 24) q = q.split(',')[0].slice(0, 24);
        return { name: cap(i.name.trim()), qty: q, category: guessCategory(i.name) || 'Sonstiges', recipe: r.name };
      });
  }

  async function addIngredients(r) {
    const items = ingredientItems(r);
    if (items.length) {
      await rpc('add_items_bulk', { p_items: items, p_by: me });
      ping();
      load();
    }
    return items.length;
  }

  async function onMatch(r, why) {
    r.matched = true;
    seen.add(r.id);
    let n = 0;
    try { n = await addIngredients(r); } catch { toast('Zutaten konnten nicht auf die Liste.'); }
    renderCook();
    updateBadge();
    confetti();
    const o = document.createElement('div');
    o.className = 'match-overlay';
    o.innerHTML = `<div class="match-card">
      <div class="mimg" ${bg(r.image)}></div>
      <div class="mc">
        <div class="match-kicker">💚 Treffer!</div>
        <h2>${esc(r.name)}</h2>
        <p>${esc(why)} ${n ? `${n} Zutaten stehen jetzt auf der Einkaufsliste.` : 'Alle Zutaten habt ihr schon im Haus.'}</p>
        <button class="btn-main" type="button">Weiter wischen</button>
        <a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">Rezept in Cookidoo ansehen</a>
      </div></div>`;
    o.addEventListener('click', e => { if (e.target === o || e.target.closest('.btn-main')) o.remove(); });
    document.body.append(o);
  }

  async function cookAction(act, t) {
    const r = t.dataset.id && cook?.recipes.find(x => x.id === t.dataset.id);
    const top = deckOf()[0];
    if (act === 'yes' || act === 'no') return swipe(top, act === 'yes');
    if (act === 'undo') {
      const id = undoStack.pop();
      const u = cook.recipes.find(x => x.id === id);
      if (u && !u.matched) { u.my_vote = null; undoneId = id; }
      renderCook(); updateBadge();
      return;
    }
    if (act === 'force' && r) {
      const res = await rpc('force_match', { p_recipe: r.id });
      ping();
      if (res && res.new_match) await onMatch(r, 'Kommt auf den Plan.');
      return;
    }
    if (act === 'readd' && r) {
      const n = await addIngredients(r);
      toast(n ? `${n} Zutaten auf die Liste gesetzt` : 'Alles schon im Haus');
      return;
    }
    if (act === 'unmatch' && r) {
      r.matched = false;
      renderCook();
      await rpc('remove_match', { p_recipe: r.id });
      ping();
      toast(`„${r.name}“ vom Plan genommen`);
      return;
    }
    if (act === 'pantry-del') {
      const names = cook.pantry.filter(p => p !== t.dataset.name);
      cook.pantry = names; renderCook();
      await rpc('set_pantry', { p_names: names });
      return;
    }
    if (act === 'push') return enablePush();
  }

  $('cook').addEventListener('submit', async e => {
    e.preventDefault();
    const v = cap($('pantryInput').value.trim());
    if (!v || cook.pantry.some(p => p.toLowerCase() === v.toLowerCase())) return;
    cook.pantry = [...cook.pantry, v].sort((a, b) => a.localeCompare(b, 'de'));
    renderCook();
    await rpc('set_pantry', { p_names: cook.pantry });
  });

  // --- Push ---
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  async function renderPushState() {
    const el = $('pushState');
    if (!el) return;
    if (!pushSupported()) {
      el.innerHTML = `<p style="margin:0">${/iPhone|iPad/.test(navigator.userAgent) && !isStandalone()
        ? 'Auf dem iPhone geht das nur, wenn die App auf dem Home-Bildschirm liegt: Teilen → „Zum Home-Bildschirm“, dann von dort öffnen.'
        : 'Dieser Browser kann keine Mitteilungen.'}</p>`;
      return;
    }
    let on = false;
    try { on = Notification.permission === 'granted' && !!(await (await navigator.serviceWorker.ready).pushManager.getSubscription()); } catch {}
    el.innerHTML = on ? '<span class="ok-line">✓ Ist eingeschaltet</span>'
      : Notification.permission === 'denied' ? '<p style="margin:0">Mitteilungen sind blockiert. Erlaube sie in den Einstellungen deines Handys für diese App.</p>'
      : '<button class="btn-line go" data-act="push">Erinnerung einschalten</button>';
  }

  async function enablePush() {
    try {
      if (await Notification.requestPermission() !== 'granted') { renderPushState(); return; }
      const reg = await navigator.serviceWorker.ready;
      const key = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
      const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
      const j = sub.toJSON();
      await rpc('save_push', { p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_person: me });
      toast('Erinnerung ist an 🔔');
    } catch {
      toast('Hat nicht geklappt – bitte nochmal versuchen.');
    }
    renderPushState();
  }

  // --- Anmeldung ---
  function logout(msg) {
    pin = null;
    store.del('ek_pin');
    $('loginName').value = me;
    $('loginPin').value = '';
    $('loginErr').textContent = msg || '';
    $('login').hidden = false;
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('loginName').value.trim();
    const p = $('loginPin').value;
    $('loginErr').textContent = '';
    if (p.length < 4) { $('loginErr').textContent = 'Die PIN braucht mindestens 4 Zeichen.'; return; }
    const { data, error } = await sb.rpc('login', { p_pin: p });
    if (error) {
      $('loginErr').textContent = /invalid pin/.test(error.message) ? 'PIN stimmt nicht.' : 'Keine Verbindung – bitte nochmal versuchen.';
      return;
    }
    pin = p; me = name;
    store.set('ek_pin', p); store.set('ek_name', name);
    $('who').textContent = `Angemeldet als ${me}`;
    $('login').hidden = true;
    if (data === 'created') toast('PIN festgelegt – gib sie deiner Freundin.');
    load();
    loadCook();
  });

  // --- Start ---
  $('date').textContent = new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date());
  $('cat').innerHTML = CATS.map(c => `<option value="${esc(c.id)}">${c.icon} ${esc(c.id)}</option>`).join('');
  setCat('Sonstiges');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (location.hash === '#kochen') setTab('kochen');

  if (pin) { $('who').textContent = `Angemeldet als ${me}`; load(); loadCook(); }
  else logout();

  const refresh = () => { if (!document.hidden) { load(); loadCook(); } };
  setInterval(refresh, 15000);
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('focus', refresh);
</script>
</body>
</html>
